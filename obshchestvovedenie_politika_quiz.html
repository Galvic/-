одное гуманитарное право"}, "options": [{"id": "o0", "text": "Ограничение средств и методов ведения войны", "why": "Это одна из задач международного гуманитарного права."}, {"id": "o1", "text": "Защита раненых, больных, военнопленных и гражданского населения", "why": "Защита этих категорий лиц относится к его задачам."}, {"id": "o2", "text": "Защита объектов, не имеющих военного значения", "why": "Право ограничивает воздействие на такие объекты."}, {"id": "o3", "text": "Определение победителя парламентских выборов", "why": "Это вопрос избирательного права."}, {"id": "o4", "text": "Установление наследника монархического престола", "why": "Это вопрос организации государственной власти."}], "correct": ["o0", "o1", "o2"]}, {"id": "pol21", "topic": 1, "type": "match", "difficulty": "Понимание", "prompt": "Установите соответствие между характеристикой лидера и его образом.", "concept": "Четыре образа политического лидера", "hint": "Различите ориентацию на большую цель, интересы последователей, привлекательность программы и срочные проблемы.", "explanation": "Знаменосец ведёт к большой цели; служитель выражает интересы сторонников; торговец убеждает в привлекательности программы; пожарный решает острые проблемы.", "source": {"file": "ОБР10_0205-1(4).pdf", "grade": 10, "paragraph": 6, "printed": [58], "pages": [7], "section": "Образы политических лидеров"}, "options": [{"id": "o0", "text": "Лидер-знаменосец"}, {"id": "o1", "text": "Лидер-служитель"}, {"id": "o2", "text": "Лидер-торговец"}, {"id": "o3", "text": "Лидер-пожарный"}, {"id": "o4", "text": "Легальный лидер"}], "correct": ["o0", "o1", "o2", "o3"], "rows": ["Предлагает «великую мечту» и увлекает ею последователей.", "Выражает интересы своих приверженцев и действует от их имени.", "Представляет свою программу так, чтобы получить поддержку.", "Сосредоточивается на наиболее острых проблемах текущего момента."]}, {"id": "pol22", "topic": 2, "type": "match", "difficulty": "Понимание", "prompt": "Установите соответствие м бода частной жизни. Определите режим.", "concept": "Авторитаризм и тоталитаризм", "hint": "Сравните пределы контроля: только политическая сфера или вся общественная и частная жизнь.", "explanation": "Авторитаризм характеризуется сосредоточением власти и ограничением политической свободы при сохранении относительной свободы вне политики.", "source": {"file": "ОБР10_0206-1(2).pdf", "grade": 10, "paragraph": 7, "printed": [67, 68], "pages": [7, 8], "section": "Недемократические режимы"}, "options": [{"id": "o0", "text": "Авторитарный", "why": "Сочетание политических ограничений с относительной свободой вне политики соответствует авторитаризму."}, {"id": "o1", "text": "Тоталитарный", "why": "Он предполагает всеобъемлющий контроль, в том числе над частной жизнью."}, {"id": "o2", "text": "Демократический", "why": "Демократия предусматривает политическое многообразие и участие граждан в контроле власти."}, {"id": "o3", "text": "Федеративный", "why": "Федерация — форма территориального устройства, а не политический режим."}, {"id": "o4", "text": "Парламентский", "why": "Парламентская республика — вид формы правления; это не название описанного режима."}], "correct": "o0"}, {"id": "pol39", "topic": 3, "type": "case", "difficulty": "Применение", "prompt": "Учебный пример. На выборах получено 1000 действительных голосов: за кандидатов А, Б и В — 480, 320 и 200 соответственно. По правилам этих выборов победил А. Определите использованный способ установления победителя.", "concept": "Относительное и абсолютное большинство", "hint": "Сравните результат победителя с результатами соперников и с половиной общего числа голосов.", "explanation": "480 голосов больше результата каждого соперника, но меньше половины 1000. Это победа по правилу относительного большинства.", "source": {"file": "ОБР10_0207-1(1).pdf", "grade": 10, "paragraph": 8, "printed": [74], "pages": [6], "section": "Мажоритарные избирательные системы"}, "options": [{"id": "o0", "text": "Относительное большинство", "why": "Достаточно получить больше голосов, чем любой другой кандидат."}, {"id": "o1", "text": "Абсолютное большинство", "why": "480 из 1000 не превышает половины голосов."}, {"id": "o2", "text": "Пропорциональное распределение по партийным спискам", "why": "В условии определяется один победитель среди кандидатов, а не распределяются места между списками."}, {"id": "o3", "text": "Сочетание мажоритарной и пропорциональной систем", "why": "В условии нет второго, пропорционального способа распределения мест."}, {"id": "o4", "text": "Избрание промежуточным органом", "why": "В условии победитель установлен по голосам избирателей, а не промежуточного органа."}], "correct": "o0"}, {"id": "pol40", "topic": 4, "type": "case", "difficulty": "Применение", "prompt": "Учебный пример. В ходе вооружённого конфликта раненому пленному оказывают медицинскую помощь и обеспечивают питание и укрытие. Определите принцип, который непосредственно проявляется в этих действиях.", "concept": "Гуманное обращение с жертвами конфликта", "hint": "Оцените, на какую потребность человека направлены действия независимо от его принадлежности к стороне конфликта.", "explanation": "Принцип гуманного обращения гарантирует защиту гражданским лицам, лицам, вышедшим из строя, и попавшим во власть противника. Лицам, лишённым свободы, должны быть предоставлены кров, питание, вода, одежда и медицинская помощь.", "source": {"file": "ОБР11_0208(1).pdf", "grade": 11, "paragraph": 8, "printed": [87, 88], "pages": [7, 8], "section": "Защита жертв вооружённого конфликта"}, "options": [{"id": "o0", "text": "Гуманное обращение", "why": "Предоставление крова, питания и медицинской помощи лицу, лишённому свободы, прямо связано с принципом гуманного обращения."}, {"id": "o1", "text": "Проведение различия", "why": "Этот принцип требует различать участников и объекты при ведении военных действий; в ситуации акцент сделан на помощи пленному."}, {"id": "o2", "text": "Соразмерность", "why": "Этот принцип касается соотношения воздействия при ведении военных действий; в ситуации показано обеспечение нужд пострадавшего."}, {"id": "o3", "text": "Суверенное равенство государств", "why": "Он характеризует равенство государств как участников международных отношений."}, {"id": "o4", "text": "Нерушимость границ", "why": "Этот принцип касается государственных границ, а не обращения с пострадавшими."}], "correct": "o0"}]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('quiz-data').textContent), QUESTIONS=DATA.questions, TOPICS=DATA.topics, BYID=Object.fromEntries(QUESTIONS.map(q=>[q.id,q]));
const KEY='obshchestvo-politics-international-v1', VERSION=1, app=document.getElementById('app');
const TYPE={single:'Один ответ',multi:'Несколько ответов',match:'Соответствие',short:'Краткий ответ',gap:'Пропуски',case:'Учебная ситуация'};
let memory={version:VERSION,active:null,history:[]},canSave=true,view='home',currentResult=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().replace(/ё/g,'е').trim().replace(/[.!?,;:…]+$/g,'').trim().replace(/\s+/g,' ');
function storageWarning(){document.getElementById('warning').innerHTML=canSave?'':'<div class="notice">Сохранение в этом браузере недоступно. Прогресс сохранится только до закрытия страницы.</div>'}
try{localStorage.setItem(KEY+'-test','1');localStorage.removeItem(KEY+'-test');const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.version===VERSION&&Array.isArray(x.history)){memory=x;if(memory.active&&!memory.active.ids.every(id=>BYID[id]))memory.active=null;memory.history=memory.history.filter(r=>Array.isArray(r.ids)&&r.ids.every(id=>BYID[id]));}}catch(e){canSave=false}storageWarning();
function save(){if(!canSave)return;try{localStorage.setItem(KEY,JSON.stringify(memory))}catch(e){canSave=false;storageWarning()}}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function sample(pool,n){const groups=shuffle([...new Set(pool.map(q=>q.topic))]).map(t=>shuffle(pool.filter(q=>q.topic===t)));const result=[];while(result.length<n&&groups.some(a=>a.length))for(const g of groups){if(g.length&&result.length<n)result.push(g.pop())}return shuffle(result).map(q=>q.id)}
function complete(q,a){if(q.type==='short')return norm(a).length>0;if(q.type==='multi')return Array.isArray(a)&&a.length>0;if(q.rows)return Array.isArray(a)&&q.rows.every((_,i)=>!!a[i]);return typeof a==='string'&&!!a}
function correct(q,a){if(!complete(q,a))return false;if(q.type==='short')return q.accepted.some(v=>norm(v)===norm(a));if(q.type==='multi')return a.length===q.correct.length&&new Set(a).size===a.length&&a.every(v=>q.correct.includes(v));if(q.rows)return q.correct.every((v,i)=>a[i]===v);return a===q.correct}
function total(s){return s.ids.filter(id=>correct(BYID[id],s.answers[id])).length}
function emptyCount(s){return s.ids.filter(id=>!complete(BYID[id],s.answers[id])).length}
function source(q){return `${q.source.file} · ${q.source.grade} класс, § ${q.source.paragraph} · печатные с. ${q.source.printed.join(', ')} (PDF: ${q.source.pages.join(', ')}) · ${q.source.section}${q.source.extra?' · '+q.source.extra:''}`}
function btn(text,action,cls='',extra=''){return `<button class="${cls}" data-action="${action}" ${extra}>${text}</button>`}
function modeName(s){return s.retryKind==='hints'?'Повтор после подсказок':s.mode==='review'?'Работа над ошибками':s.mode==='exam'?'Проверка':'Изучение'}
function date(s){return new Date(s.finished||s.started).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}
function focusTitle(){requestAnimationFrame(()=>{const h=app.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}window.scrollTo(0,0)})}
let modalAction=null;const modal=document.getElementById('modal');
function ask(title,text,yes,fn){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=text;document.getElementById('confirmModal').textContent=yes;modalAction=fn;modal.showModal();document.getElementById('cancelModal').focus()}
document.getElementById('cancelModal').onclick=()=>{modal.close();modalAction=null};document.getElementById('confirmModal').onclick=()=>{const f=modalAction;modal.close();modalAction=null;if(f)f()};
function home(){view='home';const last=memory.history.at(-1);const errors=last?last.ids.filter(id=>!correct(BYID[id],last.answers[id])):[];app.innerHTML=`
<section class="hero"><div><div class="eyebrow">Политика. Государство. Мир</div><h1>Понять. Проверить.<br>Закрепить.</h1><p class="muted">От политической власти до международных отношений. Изучайте понятия, разбирайте ситуации и закрепляйте знания по шести параграфам.</p></div><div class="hero-art"><div><div class="statnum">40</div><div>заданий в банке</div></div><div class="statsmall"><div><strong>6</strong><span class="small">тем</span></div><div><strong>6</strong><span class="small">типов заданий</span></div></div></div></section>
${memory.active?`<section class="info row spread" style="margin-bottom:22px"><div><strong>Есть незавершённая попытка</strong><div class="small">${modeName(memory.active)} · заполнено ${memory.active.ids.length-emptyCount(memory.active)} из ${memory.active.ids.length}${memory.active.deadline?' · таймер продолжает отсчёт':''}</div></div>${btn('Продолжить','resume','primary')}</section>`:''}
<section class="panel"><h2>Настройте свою практику</h2><p class="muted">Выберите тему и удобный способ работы.</p><fieldset style="border:0;padding:0;margin:0"><legend class="small">Режим</legend><div class="modes">${[['study','Изучение','Подсказки и разбор сразу после ответа.'],['exam','Проверка','Самостоятельная попытка. Разбор — в конце.'],['review','Работа над ошибками',last?`В последней попытке для повтора: ${errors.length}.`:'Появится после первой завершённой попытки.']].map(([id,name,desc])=>`<label class="mode"><input type="radio" name="mode" value="${id}" ${id==='study'?'checked':''} ${id==='review'&&!errors.length?'disabled':''}><strong>${name}</strong><p>${desc}</p></label>`).join('')}</div></fieldset>
<div class="grid2"><label class="field">Тема<select id="topic"><option value="all">Все темы · 40 заданий</option>${Object.entries(TOPICS).map(([id,t])=>`<option value="${id}">${id}. ${t} · ${QUESTIONS.filter(q=>q.topic==id).length}</option>`).join('')}</select></label><label class="field">Объём попытки<select id="count"></select></label></div><p class="small muted" id="poolInfo" style="margin-top:10px"></p>
<div id="timerSettings" class="hidden"><label class="row"><input type="checkbox" id="timerOn"> Ограничить время</label><label id="minuteLabel" class="row hidden" style="margin-top:12px">Минуты <input id="minutes" type="number" required min="1" max="180" value="20" style="width:110px"></label><p class="small muted">Когда время закончится, попытка завершится автоматически.</p></div>
<div class="actions">${btn('Начать практику →','start','primary')}</div><p class="small muted" style="margin-top:15px">Без регистрации · ответы хранятся только в этом браузере</p></section>
<section class="panel"><details><summary>Как устроены задания и оценивание</summary><ul class="clean"><li>12 заданий с одним ответом, 8 с несколькими, 6 на соответствие, 6 с кратким ответом, 4 с пропусками и 4 ситуации.</li><li>16 заданий базового уровня, 16 на понимание, 8 на применение.</li><li>Каждое полностью верное задание даёт 1 балл. Неполное соответствие или неточный набор ответов — 0 баллов; отдельные элементы разбираются отдельно.</li><li>В кратком ответе регистр, «е/ё», лишние пробелы и конечная пунктуация не влияют на проверку. Принимаются заранее заданные равнозначные формы.</li><li>В изучении после проверки ответ фиксируется. Повторить задание можно в новой попытке. В проверке ответы можно менять до завершения.</li></ul></details><details><summary>Источник и ссылки на страницы</summary><p>Банк составлен по шести предоставленным фрагментам учебных пособий: 10 класс, § 6 «Политика и её роль в общественной жизни», § 7 «Государство в политической системе», § 8 «Демократия»; 11 класс, § 8 «Правовые основы международных отношений», § 9 «Геополитическое положение и национальные интересы Республики Беларусь», § 10 «Республика Беларусь в системе международных отношений». В каждом разборе указаны файл, класс, параграф, печатная страница и страница PDF.</p><p>Для сверки откройте исходный PDF отдельно. Учебные ситуации сконструированы для тренировки и обозначены как учебные примеры. Отдельные конспекты для сопоставления не приложены. Ответы определяются содержанием приложенных фрагментов. Знание актуальных статистических показателей и редакций законодательства не требуется.</p></details>${memory.history.length?`<details><summary>Мои попытки · ${memory.history.length}</summary>${[...memory.history].reverse().map(r=>`<div class="historyitem row spread"><div><strong>${total(r)} / ${r.ids.length}</strong> · ${modeName(r)}<div class="small muted">${date(r)}${r.originId?' · повтор':''}</div></div>${btn('Открыть разбор','result','','data-id="'+r.uid+'"')}</div>`).join('')}</details>`:''}<div class="sep"></div>${btn('Сбросить прогресс','reset','quiet small')}</section>`;updateSetup();}
function pool(){const t=document.getElementById('topic').value;return QUESTIONS.filter(q=>t==='all'||q.topic==t)}
function updateSetup(){const mode=document.querySelector('[name=mode]:checked').value;const review=mode==='review';document.getElementById('topic').disabled=review;document.getElementById('timerSettings').classList.toggle('hidden',mode!=='exam');const n=review?(memory.history.at(-1)?.ids.filter(id=>!correct(BYID[id],memory.history.at(-1).answers[id])).length||0):pool().length;const count=document.getElementById('count');const prev=count.value;count.innerHTML=(review?[]:[10,20].filter(v=>v<n)).map(v=>`<option value="${v}">${v} заданий</option>`).join('')+`<option value="${n}">${review?'Все ошибки':document.getElementById('topic').value==='all'?'Весь банк':'Все задания темы'} · ${n}</option>`;if([...count.options].some(o=>o.value===prev))count.value=prev;document.getElementById('poolInfo').textContent=review?'Повторятся только неверные и незаполненные задания последней попытки.':`Доступно: ${n}. Порядок заданий и вариантов перемешивается. В общей подборке представлены разные темы.`;}
function begin(ids,mode,originId=null,parentId=null,retryKind=null,minutes=0){memory.active={uid:'a'+Date.now()+Math.random().toString(36).slice(2,7),ids:shuffle(ids),mode,index:0,answers:{},submitted:{},hints:{},flags:{},orders:Object.fromEntries(ids.map(id=>[id,shuffle((BYID[id].options||[]).map(o=>o.id))])),started:Date.now(),deadline:minutes?Date.now()+minutes*60000:null,originId,parentId,retryKind};save();question();focusTitle()}
function start(){const mode=document.querySelector('[name=mode]:checked').value;if(mode==='review')return retry(memory.history.at(-1),'errors');const ids=sample(pool(),Number(document.getElementById('count').value));let minutes=0;if(mode==='exam'&&document.getElementById('timerOn').checked){const input=document.getElementById('minutes');if(!input.reportValidity())return;minutes=Number(input.value)}const go=()=>begin(ids,mode,null,null,null,minutes);if(memory.active)ask('Начать новую попытку?','Незавершённая попытка будет заменена. Результаты завершённых попыток сохранятся.','Начать',go);else go()}
function opts(q,s){return (s.orders[q.id]||q.options.map(o=>o.id)).map(id=>q.options.find(o=>o.id===id))}
function optionText(q,id){return q.options?.find(o=>o.id===id)?.text||'—'}
function renderInput(q,s,locked){const a=s.answers[q.id];if(q.type==='short')return `<label for="shortAnswer" class="small muted">Введите слово или словосочетание</label><input type="text" class="answerinput" id="shortAnswer" autocomplete="off" spellcheck="false" value="${esc(a||'')}" ${locked?'disabled':''}>`;if(q.rows)return `${q.type==='gap'?`<div class="bank"><strong>Банк слов:</strong> ${opts(q,s).map(o=>`<span>${esc(o.text)}</span>`).join('')}</div>`:''}${q.rows.map((r,i)=>`<div class="pair"><label for="row${i}"><strong>${q.type==='match'?String.fromCharCode(1040+i):i+1}.</strong> ${esc(r)}</label><select id="row${i}" data-row="${i}" ${locked?'disabled':''}><option value="">Выберите вариант</option>${opts(q,s).map(o=>`<option value="${o.id}" ${a?.[i]===o.id?'selected':''}>${esc(o.text)}</option>`).join('')}</select></div>`).join('')}`;return opts(q,s).map((o,i)=>`<label class="option"><input type="${q.type==='multi'?'checkbox':'radio'}" name="answer" value="${o.id}" ${q.type==='multi'?(a||[]).includes(o.id)?'checked':'':a===o.id?'checked':''} ${locked?'disabled':''}><span class="choice-number">${i+1}.</span><span>${esc(o.text)}</span></label>`).join('')}
function guide(q){return q.type==='multi'?'Отметьте все подходящие варианты.':q.type==='match'?'Для каждой строки выберите соответствие. Каждый вариант используется один раз; один останется лишним.':q.type==='gap'?'Выберите слово для каждого пропуска. Используйте слово один раз; в банке есть лишние слова.':q.type==='short'?'Ответьте словом или словосочетанием.':'Выберите один правильный ответ.'}
function nav(s){return `<nav aria-label="Переход по заданиям"><div class="navigation">${s.ids.map((id,i)=>{const done=complete(BYID[id],s.answers[id]);return btn(`${i+1}<span>${s.flags[id]?'★':done?'✓':'·'}</span>`,'jump',`navq ${s.index===i?'current':''} ${done?'answered':''} ${s.flags[id]?'flagged':''}`,`data-index="${i}" aria-label="Задание ${i+1}${done?', заполнено':''}${s.flags[id]?', отмечено':''}" ${s.index===i?'aria-current="step"':''}`)}).join('')}</div></nav>`}
function question(){view='question';const s=memory.active;if(!s)return home();const q=BYID[s.ids[s.index]],locked=s.mode!=='exam'&&s.submitted[q.id];app.innerHTML=`<div class="row spread qtop">${btn('← К настройкам','home','quiet small')}<span class="pill">${modeName(s)}</span><span id="clock" class="timer" role="timer"></span></div><div class="row spread small"><strong>Задание ${s.index+1} из ${s.ids.length}</strong><span id="completion">Заполнено ${s.ids.length-emptyCount(s)} из ${s.ids.length}</span></div><div class="progress"><span id="progressbar" style="width:${100*(s.ids.length-emptyCount(s))/s.ids.length}%"></span></div><section class="panel" style="margin-top:20px"><div class="row"><span class="tag">${q.topic}. ${esc(TOPICS[q.topic])}</span><span class="small muted">${TYPE[q.type]} · ${q.difficulty}</span></div><h2 class="qtitle">${esc(q.prompt)}</h2><p class="small muted">${guide(q)}</p><div id="answerArea">${renderInput(q,s,locked)}</div><p id="answerNotice" role="status" class="wrong small"></p>
${s.hints[q.id]?`<div class="info" style="margin-top:15px"><strong>Подсказка использована</strong><p>${esc(q.hint)}</p></div>`:''}
<div class="actions">${s.mode!=='exam'?btn(locked?'Ответ проверен':'Проверить ответ','check','primary',locked?'disabled':'')+btn('Подсказка','hint','',s.hints[q.id]||locked?'disabled':''):''}${btn(s.flags[q.id]?'★ Отмечено':'☆ Отметить','flag','',`aria-pressed="${!!s.flags[q.id]}"`)}</div>${locked?feedback(q,s):''}
<div class="sep"></div><div class="row spread"><div class="row">${btn('← Назад','prev','',s.index===0?'disabled':'')}${s.index<s.ids.length-1?btn('Далее →','next','primary'):''}</div>${btn('Завершить','finish','green')}</div></section><section class="panel noprint"><details open><summary>Навигация по заданиям</summary><p class="small muted">✓ заполнено · ★ вернуться позже · рамка — текущее задание</p><div id="navArea">${nav(s)}</div></details></section>`;tick()}
function updateAnswer(target){const s=memory.active;if(view!=='question'||!s)return;const q=BYID[s.ids[s.index]];if(s.mode!=='exam'&&s.submitted[q.id])return;if(target.id==='shortAnswer')s.answers[q.id]=target.value;else if(target.dataset.row!==undefined){const a=Array.isArray(s.answers[q.id])?[...s.answers[q.id]]:Array(q.rows.length).fill('');a[Number(target.dataset.row)]=target.value;s.answers[q.id]=a}else if(target.name==='answer'){s.answers[q.id]=q.type==='multi'?[...document.querySelectorAll('[name=answer]:checked')].map(x=>x.value):target.value}else return;save();document.getElementById('answerNotice').textContent='';document.getElementById('completion').textContent=`Заполнено ${s.ids.length-emptyCount(s)} из ${s.ids.length}`;document.getElementById('progressbar').style.width=`${100*(s.ids.length-emptyCount(s))/s.ids.length}%`;document.getElementById('navArea').innerHTML=nav(s)}
function feedback(q,s){const a=s.answers[q.id],ok=correct(q,a),filled=complete(q,a);let content='';if(q.rows)content=`<ul>${q.rows.map((r,i)=>`<li><strong>${a?.[i]===q.correct[i]?'✓ Верно':a?.[i]?'× Исправьте':'— Не заполнено'}.</strong> ${esc(r)}<br>Ваш ответ: ${esc(optionText(q,a?.[i]))}.<br><strong>Правильно: ${esc(optionText(q,q.correct[i]))}.</strong></li>`).join('')}</ul><p class="small">Верных элементов: ${q.correct.filter((x,i)=>x===a?.[i]).length} из ${q.rows.length}. Балл даётся только за полностью верное задание.</p>`;else if(q.type==='short')content=`<p>Ваш ответ: <strong>${esc(a||'—')}</strong><br>Правильно: <strong>${esc(q.accepted[0])}</strong></p>`;else{content=`<p>Ваш ответ: <strong>${esc(q.type==='multi'?(a||[]).map(id=>optionText(q,id)).join('; ')||'—':optionText(q,a))}</strong></p><p>Правильно: <strong>${esc((Array.isArray(q.correct)?q.correct:[q.correct]).map(id=>optionText(q,id)).join('; '))}</strong></p><ul>${opts(q,s).map(o=>`<li><strong>${(Array.isArray(q.correct)?q.correct.includes(o.id):q.correct===o.id)?'✓ Верный вариант':'× Неверный вариант'}: ${esc(o.text)}</strong><br>${esc(o.why)}</li>`).join('')}</ul>`}return `<div role="region" aria-label="Разбор ответа" class="feedback ${ok?'':'bad'}"><h3>${ok?'✓ Верно · 1 балл':!filled?'— Задание не заполнено полностью · 0 баллов':'× Требует повторения · 0 баллов'}</h3>${s.hints[q.id]?'<p class="small"><strong>Ответ с подсказкой.</strong> Попробуйте повторить самостоятельно.</p>':''}<p>${esc(q.explanation)}</p>${content}<p class="source"><strong>Где повторить:</strong> ${esc(source(q))}</p></div>`}
function finish(force=false){const s=memory.active;if(!s)return;const pending=emptyCount(s);if(!force&&pending)return ask('Завершить попытку?',`Незаполненных заданий: ${pending} (включая частично заполненные). Они получат 0 баллов и попадут в работу над ошибками.`,'Завершить',()=>finish(true));s.finished=Date.now();s.index=0;memory.history.push(JSON.parse(JSON.stringify(s)));memory.active=null;save();result(s.uid);focusTitle()}
function retry(r,kind){if(!r)return;const ids=r.ids.filter(id=>kind==='hints'?correct(BYID[id],r.answers[id])&&r.hints[id]:!correct(BYID[id],r.answers[id]));if(!ids.length)return;const go=()=>begin(ids,'review',r.originId||r.uid,r.uid,kind);if(memory.active)ask('Перейти к повторению?','Незавершённая попытка будет заменена. Завершённые результаты сохранятся.','Перейти',go);else go()}
function result(uid){const r=memory.history.find(x=>x.uid===uid);if(!r)return home();view='result';currentResult=uid;const score=total(r),errors=r.ids.filter(id=>!correct(BYID[id],r.answers[id])),hints=r.ids.filter(id=>correct(BYID[id],r.answers[id])&&r.hints[id]),origin=memory.history.find(x=>x.uid===r.originId),prior=origin?r.ids.filter(id=>correct(BYID[id],origin.answers[id])).length:0;
app.innerHTML=`<div class="row spread noprint" style="margin-bottom:20px">${btn('← К настройкам','home','quiet small')}<span class="pill">${modeName(r)} · ${date(r)}</span></div><section class="panel"><div class="eyebrow">Результат попытки</div><h1>${score===r.ids.length?'Всё получилось.':score?'Есть на что опереться.':'Начнём с разбора.'}</h1><div class="score">${score} <small>/ ${r.ids.length} баллов</small></div><div class="metrics"><div class="metric"><strong>${Math.round(score/r.ids.length*100)}%</strong><span>верных заданий</span></div><div class="metric"><strong>${emptyCount(r)}</strong><span>незаполненных полностью</span></div><div class="metric"><strong>${r.ids.filter(id=>r.hints[id]).length}</strong><span>с подсказкой</span></div></div><p>${errors.length?`Для закрепления осталось ${errors.length} заданий. Разберите объяснения и повторите их без спешки.`:'Все задания этой попытки выполнены верно.'}</p>${origin?`<div class="info"><strong>Прогресс на тех же ${r.ids.length} заданиях:</strong> ${prior} → ${score} верных.<br><span class="small">Сравнение с первой попыткой цепочки: ${total(origin)} / ${origin.ids.length} (${date(origin)}). Её результат сохранён.</span></div>`:''}${r.expired?'<p class="small muted">Попытка автоматически завершена по истечении времени.</p>':''}<div class="actions noprint">${btn('Работа над ошибками','retry','primary',errors.length?'':'disabled')}${hints.length?btn(`Повторить без подсказок · ${hints.length}`,'retryHints'):''}${btn('Новая попытка','home')}${btn('Распечатать результат','print')}</div></section>
<section class="panel"><h2>Результаты по темам</h2>${Object.entries(TOPICS).filter(([id])=>r.ids.some(x=>BYID[x].topic==id)).map(([id,t])=>{const ids=r.ids.filter(x=>BYID[x].topic==id),n=ids.filter(x=>correct(BYID[x],r.answers[x])).length;return `<div class="topic-result"><div class="row spread"><span>${id}. ${esc(t)}</span><strong>${n} / ${ids.length}</strong></div><div class="progress"><span style="width:${100*n/ids.length}%"></span></div></div>`}).join('')}</section>
${errors.length?`<section class="panel"><h2>Что повторить</h2><ul class="clean">${errors.map(id=>{const q=BYID[id];return `<li><strong>${esc(q.concept)}</strong><br><span class="small muted">${esc(source(q))}</span></li>`}).join('')}</ul></section>`:''}
<section class="panel"><h2>Полный разбор</h2><p class="small muted">Ваши ответы, ключи и объяснения ко всем заданиям попытки.</p>${r.ids.map((id,i)=>`<article class="review"><div class="small muted">Задание ${i+1} · ${TYPE[BYID[id].type]} · тема ${BYID[id].topic}</div><h3>${esc(BYID[id].prompt)}</h3>${feedback(BYID[id],r)}</article>`).join('')}</section>`}
function tick(){const s=memory.active;if(!s?.deadline)return;const diff=s.deadline-Date.now();if(diff<=0){s.expired=true;if(modal.open){modal.close();modalAction=null}finish(true);return}const c=document.getElementById('clock');if(c){const sec=Math.ceil(diff/1000);c.textContent=`Осталось ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}}
setInterval(tick,1000);
app.addEventListener('input',e=>{if(e.target.id==='shortAnswer')updateAnswer(e.target)});
app.addEventListener('change',e=>{if(e.target.name==='mode'||e.target.id==='topic'){updateSetup();return}if(e.target.id==='timerOn'){document.getElementById('minuteLabel').classList.toggle('hidden',!e.target.checked);return}updateAnswer(e.target)});
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,s=memory.active,q=s?BYID[s.ids[s.index]]:null;if(action==='home'){home();focusTitle()}else if(action==='start')start();else if(action==='resume'){question();focusTitle()}else if(action==='reset')ask('Сбросить весь прогресс?','Текущая попытка и история результатов будут удалены только в этом браузере.','Сбросить',()=>{memory={version:VERSION,active:null,history:[]};save();home();focusTitle()});else if(action==='result'){result(b.dataset.id);focusTitle()}else if(action==='retry')retry(memory.history.find(r=>r.uid===currentResult),'errors');else if(action==='retryHints')retry(memory.history.find(r=>r.uid===currentResult),'hints');else if(action==='print')window.print();else if(action==='finish')finish();else if(action==='flag'){s.flags[q.id]=!s.flags[q.id];save();question()}else if(action==='hint'){s.hints[q.id]=true;save();question()}else if(action==='check'){if(!complete(q,s.answers[q.id])){document.getElementById('answerNotice').textContent='Заполните ответ целиком, чтобы проверить его.';return}s.submitted[q.id]=true;save();question();app.querySelector('.feedback')?.scrollIntoView({block:'nearest',behavior:'smooth'})}else if(action==='next'||action==='prev'||action==='jump'){s.index=action==='jump'?Number(b.dataset.index):s.index+(action==='next'?1:-1);save();question();focusTitle()}});
home();
</script></body></html>

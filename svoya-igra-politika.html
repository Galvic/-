<style>
:root{--ink:#18304a;--muted:#557084;--bg:#f2f7fa;--paper:#fff;--navy:#0c416e;--blue:#1b65a0;--green:#116e59;--pale:#e8f5ee;--stroke:#d4e1e7;--gold:#f3cc72;--danger:#a22934;--shadow:0 13px 36px rgba(18,54,88,.09)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.52;font-size:16px}button,input,select{font:inherit}button{min-height:43px;border:1px solid transparent;border-radius:12px;cursor:pointer;padding:10px 15px;font-weight:700;transition:background .13s ease,transform .13s ease}button:hover:not(:disabled){filter:brightness(.96)}button:active:not(:disabled){transform:translateY(1px)}button:disabled{cursor:not-allowed;opacity:.56}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #ef9e3c;outline-offset:3px}a{color:var(--blue)}.wrap{max-width:1460px;margin:0 auto;padding:20px 22px 100px}.mast{background:linear-gradient(110deg,#123e64,#11665c);color:white;padding:22px 0}.mast .wrap{padding-top:0;padding-bottom:0}.mast h1{margin:0;font-size:clamp(24px,3.2vw,37px);line-height:1.2}.mast p{margin:5px 0 0;opacity:.88}.eyebrow{font-weight:700;text-transform:uppercase;letter-spacing:.11em;font-size:11px;opacity:.83}.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.small{font-size:13px}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);padding:7px 12px;border-radius:100px;font-size:13px;font-weight:700}.scorestrip{position:sticky;top:0;z-index:30;background:rgba(242,247,250,.97);border-bottom:1px solid var(--stroke);box-shadow:0 3px 14px rgba(22,56,80,.07);backdrop-filter:blur(12px)}.scores{display:flex;gap:10px;overflow:auto;padding:10px max(16px,calc((100vw - 1416px)/2));scrollbar-width:thin}.teamchip{flex:1 0 154px;max-width:230px;background:white;border:1px solid #ccdee4;border-left:5px solid var(--green);border-radius:12px;padding:8px 11px}.teamchip input{width:100%;padding:2px 4px;border:1px solid transparent;border-radius:5px;font-weight:700;font-size:13px;color:var(--ink)}.teamchip input:focus{border-color:var(--blue)}.teamscore{font-size:23px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums;color:var(--navy)}.label{display:block;font-size:13px;font-weight:750;color:#45677b;margin-bottom:6px}.field{border:1px solid #b7cdd7;border-radius:10px;padding:11px 12px;background:#fff;width:100%;min-height:44px;color:var(--ink)}.field[disabled]{background:#f1f4f6}.gridform{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.panel{background:var(--paper);border:1px solid var(--stroke);border-radius:19px;padding:clamp(17px,2.3vw,30px);box-shadow:var(--shadow)}.panel h2{font-size:clamp(22px,2.8vw,31px);margin:0 0 9px;line-height:1.25}.panel h3{margin:12px 0 7px}.meta{color:var(--muted);font-size:14px}.primary{background:#0a6657;color:#fff}.blue{background:var(--navy);color:#fff}.subtle{background:#e7f0f5;color:#164c72;border-color:#cbdce4}.warning{background:#fff4eb;color:#8c3d0d;border-color:#e4c69e}.danger{background:#fff0ef;color:var(--danger);border-color:#eac6c8}.outline{background:white;color:var(--green);border:1px solid #8eb8ab}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}.actions.center{justify-content:center}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:0 0 16px}.sectiontag{color:var(--green);font-size:12px;text-transform:uppercase;font-weight:800;letter-spacing:.08em;margin-bottom:9px}.rule{border-left:4px solid var(--blue);background:#edf5fa;padding:12px 15px;margin:18px 0;border-radius:0 10px 10px 0}.boardwrap{overflow-x:auto;border-radius:17px}.board{display:grid;grid-template-columns:repeat(8,minmax(128px,1fr));gap:7px;min-width:1075px}.category{color:white;background:#154978;border-radius:12px 12px 7px 7px;display:flex;justify-content:center;align-items:center;text-align:center;padding:13px 7px;min-height:86px;font-size:clamp(13px,1.1vw,17px);font-weight:850;line-height:1.23}.tile{background:#fff;border:2px solid #b5d3da;color:#174a70;font-size:clamp(20px,2.2vw,30px);font-weight:850;min-height:73px;border-radius:10px;font-variant-numeric:tabular-nums}.tile:hover:not(:disabled){background:#e0f2ea;border-color:#3a9b7b}.tile.done{background:#edf1f3;color:#546776;border-color:#d8e1e5;font-size:14px;line-height:1.3}.tile.live{background:#fff5d8;color:#624b1a;border-color:#e0b958;font-size:14px;line-height:1.35}.tile:disabled{opacity:1}.statsline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 0}.progress{background:#d9e7eb;height:11px;border-radius:100px;overflow:hidden;flex:1;min-width:170px;max-width:460px}.progress>span{display:block;background:var(--green);height:100%;transition:width .3s}.questionhead{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.tag{border-radius:100px;background:#e1eef8;color:#11496d;padding:6px 12px;font-size:13px;font-weight:800}.tag.points{background:#eaf4df;color:#386b33}.prompt{font-size:clamp(22px,3.3vw,36px);line-height:1.39;letter-spacing:-.012em;font-weight:720;margin:10px 0 20px}.qpic{display:block;width:min(100%,600px);max-height:320px;object-fit:contain;object-position:center;border-radius:13px;margin:10px auto 15px;border:1px solid #e4eaed;background:#fff;padding:3px}.answer{background:#eaf7ef;border:1px solid #b6dcca;border-radius:16px;padding:19px;margin-top:17px}.answer h3{font-size:15px;color:#23664d;text-transform:uppercase;letter-spacing:.06em;margin:7px 0 4px}.answer p{margin:4px 0 13px}.answer .truth{font-size:clamp(19px,2.2vw,26px);font-weight:850;color:#0f513d}.session{background:#edf4fa;border-radius:13px;border:1px solid #cddfe9;padding:15px;margin:16px 0}.session .columns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.session select{min-width:min(270px,100%);max-width:100%}.feedback{border-radius:12px;border:1px solid #ddc5a6;background:#fff8eb;padding:10px 12px;margin-top:10px;color:#684312}.timerbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:13px;background:#eaf2f7;padding:11px 13px;margin:10px 0 18px}.timevalue{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums;min-width:60px}.timevalue.expired{color:#ab2d39}.notice{color:#743f10;background:#fff5e6;border:1px solid #edd2ae;border-radius:11px;padding:11px 14px;margin-bottom:14px}.review details{border:1px solid var(--stroke);background:#fff;border-radius:11px;padding:12px 15px;margin:8px 0}.review summary{font-weight:750;cursor:pointer;line-height:1.5}.review .answer{box-shadow:none;margin:10px 0 0}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #dce8ed}th{background:#edf5f7;font-size:13px;color:#355871}td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}.winner{font-size:clamp(23px,3vw,36px);color:#0d6454;font-weight:850;margin:15px 0}.betrows{display:grid;gap:10px}.betrow{display:grid;grid-template-columns:minmax(100px,1fr) minmax(90px,150px) minmax(80px,170px);align-items:center;gap:8px;padding:12px;border:1px solid var(--stroke);border-radius:12px}.radiochoices{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.radiochoices label{display:flex;align-items:center;gap:5px}.radiochoices input{accent-color:var(--green);width:18px;height:18px}#announce{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#123c5f;color:#fff;border-radius:12px;padding:11px 20px;z-index:100;box-shadow:0 8px 25px #142d3940;max-width:90vw;display:none}.foot{margin-top:32px;font-size:13px;color:#6a8190}.sep{height:1px;background:var(--stroke);margin:20px 0}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);border:0}.hold{font-size:15px}.intro{max-width:850px}.starter{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}.timercheckbox{display:flex;align-items:center;gap:10px}.timercheckbox input{width:19px;height:19px;accent-color:var(--green)}@media(max-width:850px){.wrap{padding:15px 12px 75px}.mast{padding:17px 0}.scorestrip .scores{padding:8px 12px}.teamchip{flex-basis:132px}.board{min-width:900px;grid-template-columns:repeat(8,105px);gap:5px}.tile{min-height:65px}.category{min-height:76px}.panel{padding:17px}.betrow{grid-template-columns:1fr 120px}.betrow .radiochoices{grid-column:1/-1}}@media(max-width:480px){.toolbar button,.actions button{flex:1 1 auto}.teamchip{flex:0 0 126px}.prompt{font-size:23px}.questionhead{gap:5px}.timerbox{gap:7px}.betrow{grid-template-columns:1fr 100px}}

.hints{display:grid;gap:12px;margin:14px 0}.hint{background:#eaf5f6;border-left:5px solid #166a66;border-radius:10px;padding:12px 16px}.hint p{margin:4px 0 0;font-size:clamp(17px,2vw,22px)}
</style></head>

<script>
'use strict';
const QUESTIONS=[{"id":"c1-100","cat":0,"value":100,"kind":"Анализ ситуации","section":"Тема 1","pages":"2","file":"Раздел 5. Тема 1-2(2).pdf","q":"В школьном совете председатель предлагает решение, а члены совета принимают его как обязательное. Кто здесь субъект, а кто объект властного отношения?","a":"Субъект — председатель; объект — члены совета, на которых направлено властное воздействие.","e":"Субъект является носителем властного воздействия, а объект — тем, на кого оно направлено.","criterion":"Верно указаны обе стороны и направление воздействия.","alt":"Председатель — носитель власти, члены совета — адресаты распоряжения.","img":null},{"id":"c1-200","cat":0,"value":200,"kind":"Портрет и концепция","section":"Тема 1","pages":"1","file":"Раздел 5. Тема 1-2(2).pdf","q":"Перед вами мыслитель, связывавший развитие совместной жизни с переходом от семьи к общине и государству. Назовите мыслителя и объясните роль политики в его понимании.","a":"Аристотель; политика ищет наилучшие способы управления государством как формой совместной жизни людей.","e":"В конспекте приведена цепочка «семья → община → государство».","criterion":"Названы мыслитель, связь политики с управлением государством и совместной жизнью.","alt":"Аристотель; поиск лучшего устройства и управления полисом/государством.","img":"aristotle"},{"id":"c1-300","cat":0,"value":300,"kind":"Классификация","section":"Тема 1","pages":"3","file":"Раздел 5. Тема 1-2(2).pdf","q":"Распределите по элементам политической системы четыре примера: парламент, политическая программа партии, избирательный закон, публичный диалог граждан с органом власти.","a":"Институты — парламент; идеи и ценности — программа; нормы — закон; взаимодействия — диалог граждан с властью.","e":"Политическая система включает институты, нормы, идеи и ценности, а также способы взаимодействия.","criterion":"Все четыре примера классифицированы правильно.","alt":"Партия/парламент как институт; программа как идеологический элемент; закон как нормативный; диалог как коммуникация.","img":null},{"id":"c1-400","cat":0,"value":400,"kind":"Различение","section":"Тема 1","pages":"2","file":"Раздел 5. Тема 1-2(2).pdf","q":"Власти города сначала убеждают жителей поддержать проект, затем ссылаются на свой авторитет, а при нарушении обязательных норм применяют законные меры. Назовите три разных средства властного воздействия.","a":"Убеждение, авторитет, принуждение.","e":"Это три указанных в конспекте средства осуществления властного отношения; они различаются способом влияния на объект.","criterion":"Названы все три средства и пояснено хотя бы одно существенное различие.","alt":"Можно назвать аргументацию, признанный авторитет и законное принуждение.","img":null},{"id":"c1-500","cat":0,"value":500,"kind":"Визуальный кейс","section":"Тема 1","pages":"3–4","file":"Раздел 5. Тема 1-2(2).pdf","q":"Перед вами портрет исследователя теории элит. Объясните, почему наличие способного политического лидера не тождественно наличию эффективной политической элиты.","a":"Вильфредо Парето связан с теорией элит; лидер — отдельная личность, оказывающая устойчивое влияние, а элита — группа, обладающая реальной властью и управленческим опытом.","e":"В пособии политический лидер определяется как личность, а политическая элита — как группа; Парето назван одним из исследователей элит.","criterion":"Указано различие «личность — группа» и минимум один признак элиты (власть, опыт, сплочённость).","alt":"Ответ может не содержать фамилию Парето, если верно раскрыты обе категории.","img":"pareto"},{"id":"c1-600","cat":0,"value":600,"kind":"Диагностика сбоя","section":"Тема 1","pages":"3","file":"Раздел 5. Тема 1-2(2).pdf","q":"В государстве цели развития объявлены, законы приняты, но органы власти не обмениваются сведениями, а результаты исполнения решений не оцениваются. Какие две функции политической системы нарушены? Обоснуйте.","a":"Коммуникация и контроль.","e":"Коммуникация обеспечивает обмен информацией между элементами системы; контроль — оценку исполнения норм и решений.","criterion":"Верно определены обе функции и каждая соотнесена с условием задачи.","alt":"Обмен сведениями — коммуникативная функция; оценка исполнения — контрольная.","img":null},{"id":"c1-700","cat":0,"value":700,"kind":"Многошаговый анализ","section":"Тема 1","pages":"2, 5–6","file":"Раздел 5. Тема 1-2(2).pdf","q":"Сторонники реформы имеют широкую общественную поддержку, но не располагают официальными полномочиями. Они утверждают, что уже обладают государственной властью. Найдите логическую ошибку и разграничьте политическое влияние, политическую власть и государственную власть.","a":"Поддержка и влияние не равны государственной власти. Политическое влияние может воздействовать на решения; политическая власть опирается на политические институты и нормы; государственная власть осуществляется специальными органами с правом издавать общеобязательные акты.","e":"Конспект отличает властное воздействие, политическую власть и особые полномочия государства.","criterion":"Названа ошибка; разграничены три уровня; отмечена специфика органов и общеобязательности государственных решений.","alt":"Допустимы иные аргументированные разграничения при сохранении особого правового статуса государства.","img":null},{"id":"c2-100","cat":1,"value":100,"kind":"Систематизация","section":"Тема 2","pages":"7","file":"Раздел 5. Тема 1-2(2).pdf","q":"Назовите три составляющие формы государства.","a":"Форма правления, форма территориального устройства, политический режим.","e":"Форма государства описывает, кто и как управляет, как организована территория и какими методами реализуется власть.","criterion":"Названы все три компонента.","alt":"Форма правления; государственное устройство; политический режим.","img":null},{"id":"c2-200","cat":1,"value":200,"kind":"Различение","section":"Тема 2","pages":"10","file":"Раздел 5. Тема 1-2(2).pdf","q":"Один монарх правит без ограничений, а полномочия другого ограничены конституцией. Как называются эти разновидности монархии?","a":"Абсолютная и конституционная монархия соответственно.","e":"Различие определяется степенью правовых ограничений единоличного главы государства.","criterion":"Соотнесены оба случая и указано основание различения.","alt":"Неограниченная — абсолютная; ограниченная конституцией — конституционная.","img":null},{"id":"c2-300","cat":1,"value":300,"kind":"Сопоставление","section":"Тема 2","pages":"8","file":"Раздел 5. Тема 1-2(2).pdf","q":"Первое государство состоит из субъектов со своими законами и общей федеральной системой власти; второе — союз самостоятельных государств ради общих задач. Назовите обе формы устройства.","a":"Федерация и конфедерация соответственно.","e":"Субъекты федерации имеют признаки самостоятельности внутри единого союзного государства; члены конфедерации сохраняют юридическую и политическую самостоятельность.","criterion":"Правильно названы обе формы и отмечено различие статуса участников.","alt":"Союзное государство — федерация; союз самостоятельных государств — конфедерация.","img":null},{"id":"c2-400","cat":1,"value":400,"kind":"Правовой анализ","section":"Тема 2","pages":"6","file":"Раздел 5. Тема 1-2(2).pdf","q":"Почему добровольное объединение граждан не может по собственному решению установить обязательный для всего населения налог или создать собственную уголовную систему наказаний?","a":"Эти действия относятся к монопольным полномочиям государства: взиманию налогов и применению законного принуждения.","e":"Государство обладает специальным аппаратом и исключительными полномочиями, которыми общественные организации не наделены.","criterion":"Указаны обе монополии и обосновано отличие от негосударственного объединения.","alt":"Налоги и законное государственное принуждение требуют специальной публичной компетенции.","img":null},{"id":"c2-500","cat":1,"value":500,"kind":"Кейс: форма ≠ режим","section":"Тема 2","pages":"8, 10","file":"Раздел 5. Тема 1-2(2).pdf","q":"В стране высшие органы избираются, но власти контролируют почти все области частной жизни и подавляют свободы. Объясните, почему название формы правления не позволяет установить политический режим.","a":"Форма правления может быть республиканской, но описанные признаки относятся к тоталитарному политическому режиму. Это разные составляющие формы государства.","e":"Республика характеризует порядок формирования верховных органов, режим — методы функционирования власти.","criterion":"Обозначены республика, тоталитарные признаки и различие двух измерений.","alt":"Засчитывается вывод о несовпадении выборности органов и демократичности политического режима.","img":null},{"id":"c2-600","cat":1,"value":600,"kind":"Проверка классификации","section":"Тема 2","pages":"8, 10","file":"Раздел 5. Тема 1-2(2).pdf","q":"В описании сказано: «Государство унитарное, поскольку парламент формирует правительство; парламентская республика, поскольку территория не разделена на субъекты». Исправьте обе ошибки и назовите два разных критерия.","a":"Унитарность определяется территориальным устройством, а парламентская республика — способом формирования правительства и его ответственностью перед парламентом. В описании критерии перепутаны.","e":"Территориальная организация и механизм ответственности правительства относятся к разным составляющим формы государства.","criterion":"Установлено перепутывание критериев, корректно охарактеризованы обе формы.","alt":"Допустима формулировка через «форма устройства» и «форма правления».","img":null},{"id":"c2-700","cat":1,"value":700,"kind":"Комплексная типология","section":"Тема 2","pages":"8, 10","file":"Раздел 5. Тема 1-2(2).pdf","q":"В условном государстве глава государства избирается; кабинет формируется парламентом и отвечает перед ним; территория делится на единицы без государственной самостоятельности; политическая власть сосредоточена у узкой группы, но вне политики сохраняется относительная свобода. Дайте полную характеристику формы государства по трём измерениям.","a":"Парламентская республика; унитарное государство; авторитарный режим.","e":"Конспекты описывают каждый признак как самостоятельный критерий: отношения высших органов, устройство территории, способ осуществления власти.","criterion":"Все три компонента верны; каждый подкреплён признаком из условия.","alt":"Парламентская форма республики, унитарное устройство, авторитарный характер режима.","img":null},{"id":"c3-100","cat":2,"value":100,"kind":"Определение","section":"Тема 3","pages":"1","file":"Раздел 5. Тема 3-4(2).pdf","q":"В городском собрании граждане сами принимают обязательное решение, не передавая полномочия депутатам. Какую форму демократии иллюстрирует случай?","a":"Прямая демократия.","e":"В прямой демократии народ осуществляет власть непосредственно без политических посредников.","criterion":"Названа форма и отмечено непосредственное решение граждан.","alt":"Непосредственная демократия.","img":null},{"id":"c3-200","cat":2,"value":200,"kind":"Правовой статус","section":"Тема 3","pages":"7","file":"Раздел 5. Тема 3-4(2).pdf","q":"Гражданин имеет право голосовать на выборах и право баллотироваться на выборную должность. Назовите оба права в указанном порядке.","a":"Активное и пассивное избирательное право.","e":"Активное право означает избирать, пассивное — быть избранным.","criterion":"Оба термина названы и не перепутаны.","alt":"Активное — голосовать; пассивное — баллотироваться.","img":null},{"id":"c3-300","cat":2,"value":300,"kind":"Подсчёт голосов","section":"Тема 3","pages":"3","file":"Раздел 5. Тема 3-4(2).pdf","q":"В округе по мажоритарной системе абсолютного большинства голоса распределились так: А — 47 %, Б — 32 %, В — 21 %. Избран ли кто-либо в первом туре? Какой механизм предусмотрен конспектом при необходимости?","a":"Никто не получил более 50 %; потребуется второй тур с двумя кандидатами, набравшими больше остальных: А и Б.","e":"Абсолютное большинство требует более половины голосов.","criterion":"Указан порог, отсутствие победителя и два участника возможного второго тура.","alt":"Нет; второй тур между А и Б.","img":null},{"id":"c3-400","cat":2,"value":400,"kind":"Анализ схемы","section":"Тема 3","pages":"3","file":"Раздел 5. Тема 3-4(2).pdf","q":"По пропорциональной системе 10 мандатов распределяются между тремя партийными списками по долям голосов 50 %, 30 % и 20 % (без порога и округления). Сколько мандатов получает каждый список и почему?","a":"5, 3 и 2 соответственно; места распределяются пропорционально полученным голосам.","e":"В отличие от мажоритарного выбора кандидата, пропорциональная система основана на долях партийных голосов.","criterion":"Все три числа верны и назван принцип пропорциональности.","alt":"Первый список — пять, второй — три, третий — два.","img":null},{"id":"c3-500","cat":2,"value":500,"kind":"Нарушение принципов","section":"Тема 3","pages":"2","file":"Раздел 5. Тема 3-4(2).pdf","q":"Избирателям разрешено голосовать, но руководитель организации требует показать заполненный бюллетень и угрожает последствиями за «неправильный» выбор. Какие два принципа выборов нарушены?","a":"Свободные выборы и тайное голосование.","e":"Свобода предполагает самостоятельный выбор, а тайна — отсутствие контроля над волеизъявлением.","criterion":"Определены оба принципа и объяснено, как нарушен каждый.","alt":"Свобода волеизъявления и тайна голосования.","img":null},{"id":"c3-600","cat":2,"value":600,"kind":"Устройство демократии","section":"Тема 3","pages":"4","file":"Раздел 5. Тема 3-4(2).pdf","q":"Общественное большинство принимает решение, а меньшинству запрещают публично выражать несогласие. Объясните, почему формального принципа большинства недостаточно для демократии. Назовите не менее двух дополнительных принципов.","a":"Демократия требует защиты прав меньшинства, политического и идеологического плюрализма, свободы мнений и равноправия граждан.","e":"Пособие подчёркивает, что большинство не вправе преследовать несогласных только за их взгляды.","criterion":"Объяснён предел власти большинства и названы минимум два принципа/права.","alt":"Защита меньшинств, свобода слова и мнений, плюрализм, равноправие.","img":null},{"id":"c3-700","cat":2,"value":700,"kind":"Многоступенчатый кейс","section":"Тема 3","pages":"3","file":"Раздел 5. Тема 3-4(2).pdf","q":"В условном парламенте 20 мест: половина избирается в округах по кандидатам, половина — по партийным спискам. По спискам две партии получили 70 % и 30 % голосов; по округам они выиграли 4 и 6 мест. Определите тип системы и итоговое число мест каждой партии. Объясните расчёт.","a":"Смешанная система. По спискам: 7 и 3 места; по округам: 4 и 6. Итог: 11 и 9 мест.","e":"Смешанная система объединяет мажоритарное избрание в округах и пропорциональное распределение другой части мест.","criterion":"Назван тип; отдельно рассчитаны списочные и окружные мандаты; итог 11 и 9.","alt":"Первая партия — 11, вторая — 9; использованы два способа распределения мест.","img":null},{"id":"c4-100","cat":3,"value":100,"kind":"Понятие","section":"Тема 4","pages":"5, 8","file":"Раздел 5. Тема 3-4(2).pdf","q":"Как называют права человека, которые принадлежат ему от рождения, а не предоставляются государством?","a":"Естественные права.","e":"Концепцию таких прав в XVII веке развивал Джон Локк.","criterion":"Правильно названо понятие и отмечена независимость происхождения прав от государства.","alt":"Прирождённые (естественные) права.","img":null},{"id":"c4-200","cat":3,"value":200,"kind":"Историческая последовательность","section":"Тема 4","pages":"5","file":"Раздел 5. Тема 3-4(2).pdf","q":"Расположите по времени: Статут ВКЛ с идеей разделения властей; Великая хартия вольностей; теория естественных прав Локка.","a":"Великая хартия вольностей (1215) → Статут ВКЛ (1588) → идеи Джона Локка (XVII в.).","e":"В конспекте эти вехи представлены как этапы становления концепции правового государства.","criterion":"Все три этапа размещены в верном порядке.","alt":"1215 → 1588 → XVII век.","img":null},{"id":"c4-300","cat":3,"value":300,"kind":"Разграничение","section":"Тема 4","pages":"6","file":"Раздел 5. Тема 3-4(2).pdf","q":"Чем семья или профсоюз как институт гражданского общества отличается от министерства как органа государства? Укажите два существенных признака.","a":"Институты гражданского общества самостоятельны и относительно независимы от государства, действуют для реализации интересов граждан; министерство входит в аппарат государственной власти.","e":"Гражданское общество — сфера самостоятельных отношений и организаций, а не часть государственного аппарата.","criterion":"Указаны независимость/самостоятельность и отличие от властных функций госоргана.","alt":"Самостоятельность и представление интересов граждан в отличие от публично-властных полномочий министерства.","img":null},{"id":"c4-400","cat":3,"value":400,"kind":"Медиа-кейс","section":"Тема 4","pages":"6","file":"Раздел 5. Тема 3-4(2).pdf","q":"Два телеканала одинаково точно передают факты, но один подробно освещает образование, другой — транспорт. Какое влияние СМИ здесь проявляется, даже если нет ложной информации?","a":"Формирование повестки дня: выбор тем меняет то, какие проблемы аудитория считает важными.","e":"СМИ воздействуют на общественное мнение не только содержанием, но и отбором тем для освещения.","criterion":"Названа повестка дня и пояснена роль отбора событий.","alt":"Теория повестки дня; влияние выбора освещаемых тем на общественную значимость вопросов.","img":null},{"id":"c4-500","cat":3,"value":500,"kind":"Проверка аргумента","section":"Тема 4","pages":"6","file":"Раздел 5. Тема 3-4(2).pdf","q":"Участник дискуссии говорит: «Гражданское общество возможно только там, где все объединения противостоят государству». Выявите ошибку и объясните, как общество может взаимодействовать с органами власти.","a":"Противостояние не является обязательным признаком. Независимые объединения могут защищать интересы, участвовать в публичном обсуждении, информировать и контролировать власть, сотрудничая с ней в рамках закона.","e":"Независимость означает самостоятельность, а не неизбежный конфликт.","criterion":"Опровергнуто ложное необходимое условие; названы минимум два направления участия.","alt":"Допустимы общественный контроль, коммуникация, защита прав, выработка предложений.","img":null},{"id":"c4-600","cat":3,"value":600,"kind":"Юридическая диагностика","section":"Тема 4","pages":"8","file":"Раздел 5. Тема 3-4(2).pdf","q":"Гражданин узнаёт об ограничении его права только после применения меры; норма не опубликована, судебное обжалование фактически недоступно. Какие составляющие принципа верховенства права ставятся под сомнение?","a":"Правовая определённость и предсказуемость норм, равенство перед законом, наличие эффективного судебного механизма защиты прав.","e":"Конспект связывает верховенство права не только с обязательностью закона, но и с равенством и судебной защитой.","criterion":"Описана проблема неопубликованной нормы, отмечена необходимость судебной защиты; приведены минимум две содержательные характеристики.","alt":"Достаточен вывод о недоступности правовой нормы и эффективной судебной защиты, с объяснением.","img":null},{"id":"c4-700","cat":3,"value":700,"kind":"Комплексный кейс","section":"Тема 4","pages":"5–6, 8","file":"Раздел 5. Тема 3-4(2).pdf","q":"В условной стране государственный орган сам принимает нормативный акт, исполняет его и окончательно разрешает споры о его законности. Общественные объединения не могут получать сведения о его деятельности. Назовите три угрозы правовому государству и гражданскому обществу.","a":"Смешение законодательной, исполнительной и судебной функций; отсутствие независимого судебного контроля; закрытость власти, препятствующая общественному контролю и деятельности гражданского общества.","e":"Правовое государство основано на верховенстве права, разграничении функций властей и защите прав; открытость информации необходима гражданскому контролю.","criterion":"Названы три разные проблемы и показана связь каждой с принципом организации власти.","alt":"Допустимо говорить о концентрации полномочий, отсутствии судебной защиты и блокировании общественного участия.","img":null},{"id":"c5-100","cat":4,"value":100,"kind":"Понятие по источнику","section":"Тема 5","pages":"1","file":"Раздел 5. Тема 5-6(2).pdf","q":"На иллюстрации — мыслитель, введший слово «идеология» для обозначения науки о происхождении идей. Назовите его.","a":"Антуан Дестют де Траси.","e":"Он упомянут в конспекте как автор термина «идеология».","criterion":"Названы фамилия и имя либо однозначно узнаваемая фамилия.","alt":"Дестют де Траси.","img":"detracy"},{"id":"c5-200","cat":4,"value":200,"kind":"Система понятий","section":"Тема 5","pages":"2","file":"Раздел 5. Тема 5-6(2).pdf","q":"Назовите три основные «суперидеологии», сохраняющие значение в современной политической мысли.","a":"Либерализм, консерватизм и социализм.","e":"Материалы рассматривают их как три базовые идеологические традиции.","criterion":"Названы все три без подмены партийными системами.","alt":"Триада: либерализм — консерватизм — социализм.","img":null},{"id":"c5-300","cat":4,"value":300,"kind":"Сопоставление","section":"Тема 5","pages":"2–3","file":"Раздел 5. Тема 5-6(2).pdf","q":"Соотнесите идеи с тремя идеологиями: А — приоритет прав личности и защита частной собственности; Б — традиции, преемственность и стабильность; В — социальная справедливость и интересы общности.","a":"А — либерализм; Б — консерватизм; В — социализм.","e":"В конспекте указаны характерные черты классических форм каждой суперидеологии.","criterion":"Все три соответствия верны.","alt":"Свобода — либеральная традиция; стабильность — консервативная; равенство — социалистическая.","img":null},{"id":"c5-400","cat":4,"value":400,"kind":"Критика обобщения","section":"Тема 5","pages":"4","file":"Раздел 5. Тема 5-6(2).pdf","q":"Партия одновременно выступает за рыночные механизмы и за расширение социальной поддержки. Доказывает ли это отсутствие у неё политической идеологии? Объясните.","a":"Нет. Современные идеологии заимствуют идеи друг друга; сочетание установок не исключает идеологического характера программы.","e":"Материал подчёркивает идеологическое разнообразие и взаимные заимствования.","criterion":"Опровергнута ошибка «смешение идей = отсутствие идеологии» и объяснено заимствование.","alt":"Идеологическая гибридность/заимствование не означают отсутствия системы ценностей.","img":null},{"id":"c5-500","cat":4,"value":500,"kind":"Разграничение приёмов","section":"Тема 5","pages":"4","file":"Раздел 5. Тема 5-6(2).pdf","q":"Политическое объединение обещает за неделю решить все социальные проблемы без указания средств, одновременно призывая к немедленной насильственной ломке порядка. Различите две характеристики такой риторики.","a":"Популизм — нереальные популярные обещания лёгкого решения; радикализм — ориентация на коренное и быстрое изменение, часто насильственным путём.","e":"Эти понятия описывают разные стороны политического действия и могут совпадать в одном выступлении.","criterion":"Названы обе категории и признаки каждой, без признания их синонимами.","alt":"Популистские обещания и радикальные методы.","img":null},{"id":"c5-600","cat":4,"value":600,"kind":"Политический спектр","section":"Тема 5","pages":"3–4","file":"Раздел 5. Тема 5-6(2).pdf","q":"Оратор утверждает: «Все левые движения обязательно радикальны, а правые всегда выступают против любых реформ». Почему оба суждения неверны по материалам?","a":"Радикализм может проявляться и справа, и слева; современные консерваторы могут признавать реформы при сохранении преемственности и устойчивых ценностей.","e":"Лево-правое расположение и готовность к радикальным методам — разные характеристики.","criterion":"Опровергнуты оба абсолютных суждения; приведены две конкретные причины.","alt":"Допустимо объяснение через самостоятельность оси радикальности и современный реформаторский консерватизм.","img":null},{"id":"c5-700","cat":4,"value":700,"kind":"Логическая реконструкция","section":"Тема 5","pages":"1–2","file":"Раздел 5. Тема 5-6(2).pdf","q":"Группа учёных формулирует политическую концепцию; партия превращает её в программу; сторонники начинают считать соответствующие ценности своими и участвуют в кампании. Установите уровни идеологии и причинную цепочку перехода к действию.","a":"Теоретический уровень (идеи, идеалы) → программно-политический (программа, лозунги) → обыденный/поведенческий (убеждения) → политическое участие.","e":"Пособие показывает переход от теории к программам, установкам граждан и их поведению.","criterion":"Названы три уровня идеологии и верно восстановлена последовательность политического действия.","alt":"Теория → партийная программа → убеждения граждан → политическая активность.","img":null},{"id":"c6-100","cat":5,"value":100,"kind":"Понятие","section":"Тема 6","pages":"5","file":"Раздел 5. Тема 5-6(2).pdf","q":"Как называется организованная группа с общей политической программой, которая стремится завоевать государственную власть или участвовать в её осуществлении?","a":"Политическая партия.","e":"Главное отличие партии — ориентация на государственную власть.","criterion":"Термин назван, признак стремления к власти сохранён.","alt":"Партия.","img":null},{"id":"c6-200","cat":5,"value":200,"kind":"Различение","section":"Тема 6","pages":"9","file":"Раздел 5. Тема 5-6(2).pdf","q":"Одна партия действует через небольшой актив и пожертвования сторонников; другая имеет массовое фиксированное членство и получает взносы. Назовите их типы.","a":"Кадровая и массовая партия соответственно.","e":"Различаются организационная структура, число членов и характер финансирования.","criterion":"Оба типа верно соотнесены с признаками.","alt":"Партия кадрового типа; массовая партия.","img":null},{"id":"c6-300","cat":5,"value":300,"kind":"Определение системы","section":"Тема 6","pages":"7, 9","file":"Раздел 5. Тема 5-6(2).pdf","q":"В стране зарегистрировано много партий, но они не взаимодействуют устойчиво и не формируют сложившиеся правила соперничества. Почему нельзя автоматически считать, что существует сложившаяся многопартийная система?","a":"Количество партий само по себе означает многопартийность, но партийная система предполагает устойчивые отношения взаимодействия и соперничества.","e":"Конспект специально различает «многопартийность» и «многопартийную систему».","criterion":"Названы оба понятия и критерий сложившихся отношений.","alt":"Формальное множество партий ещё не доказывает зрелости системы их взаимоотношений.","img":null},{"id":"c6-400","cat":5,"value":400,"kind":"Статус партии","section":"Тема 6","pages":"9","file":"Раздел 5. Тема 5-6(2).pdf","q":"Партия проиграла выборы и не формирует большинство, но публично критикует курс правящей партии и предлагает альтернативу. Какова её роль и почему она остаётся частью партийной системы?","a":"Это оппозиционная партия, участвующая в политическом соперничестве, но не обладающая правящим большинством.","e":"Партийная система охватывает и правящие, и соперничающие с ними силы.","criterion":"Определена оппозиция и объяснено её место в конкуренции за власть.","alt":"Оппозиционная партия; альтернативная политическая программа и борьба за власть.","img":null},{"id":"c6-500","cat":5,"value":500,"kind":"Социальная динамика","section":"Тема 6","pages":"5, 8","file":"Раздел 5. Тема 5-6(2).pdf","q":"Экологические активисты сначала проводят массовые акции без фиксированного членства, затем учреждают союз с членскими билетами, а позднее создают политическую структуру, участвующую в борьбе за власть. Назовите три формы объединения по порядку.","a":"Общественное движение → общественная организация → политическая партия.","e":"При изменении структуры и целей массовое движение может стать организацией и основой партии.","criterion":"Все три формы и два перехода определены правильно.","alt":"Движение, организация, партия.","img":null},{"id":"c6-600","cat":5,"value":600,"kind":"Кейс с подвохом","section":"Тема 6","pages":"5, 8","file":"Раздел 5. Тема 5-6(2).pdf","q":"Молодёжное объединение имеет устав, оплачиваемое членство, отделения в городах и направляет обращения депутатам. Руководитель называет его политической партией, потому что оно «влияет на власть». Достаточно ли этих признаков?","a":"Нет. Для партии требуется политическая цель завоевания или участия в осуществлении государственной власти; организация может влиять на решения, не претендуя на власть непосредственно.","e":"Фиксированное членство указывает на организацию, а обращения не равнозначны борьбе за государственную власть.","criterion":"Объяснена недостаточность влияния; назван целевой критерий партии и роль общественной организации.","alt":"Не обязательно партия: нужны именно цели участия во власти, а не только общественное влияние.","img":null},{"id":"c6-700","cat":5,"value":700,"kind":"Многофакторная классификация","section":"Тема 6","pages":"5, 8–9","file":"Раздел 5. Тема 5-6(2).pdf","q":"В условной стране: А — крупная организация с членскими взносами и участием в парламентских выборах; Б — сеть протестующих без членства; В — профсоюз с фиксированным членством, защищающий трудовые интересы; Г — две сильные партии регулярно сменяют друг друга у власти. Определите формы А, Б, В и тип партийной системы Г, обосновав различия.","a":"А — массовая политическая партия; Б — общественное движение; В — общественная организация; Г — двухпартийная система.","e":"Критерии: борьба за власть, структура/членство и устойчивый характер партийной конкуренции.","criterion":"Верны четыре определения; обоснованы как минимум три разных критерия.","alt":"Массовая партия, движение, профсоюз как организация, двухпартийная система.","img":null},{"id":"c7-100","cat":6,"value":100,"kind":"Понятие","section":"Тема 7","pages":"1, 3","file":"Раздел 5. Тема 7-9(2).pdf","q":"Что регулирует отношения между субъектами международных отношений с помощью системы международно-правовых норм и принципов?","a":"Международное право.","e":"Это самостоятельная нормативная система, формируемая согласованной волей субъектов, прежде всего государств.","criterion":"Назван точный термин.","alt":"Международное публичное право (в общем значении).","img":null},{"id":"c7-200","cat":6,"value":200,"kind":"Источники права","section":"Тема 7","pages":"3","file":"Раздел 5. Тема 7-9(2).pdf","q":"Назовите два основных источника международного права и поясните, когда договор становится обязательным для государства.","a":"Международный договор и международный обычай; договор обязателен, когда государство приняло соответствующее международное обязательство (например, ратифицировало его).","e":"Участие в договоре связано с выражением согласия на обязательность, а не только с публикацией текста.","criterion":"Названы оба источника и юридическое условие обязательности.","alt":"Договоры и обычаи; после юридически значимого принятия обязательств.","img":null},{"id":"c7-300","cat":6,"value":300,"kind":"Визуальное задание","section":"Тема 7","pages":"5","file":"Раздел 5. Тема 7-9(2).pdf","q":"На иллюстрации показаны три защитные эмблемы гуманитарного движения. Назовите дополнительную эмблему, учреждённую в 2005 году.","a":"Красный Кристалл.","e":"Материал указывает на учреждение дополнительного символа в 2005 г. наряду с Красным Крестом и Красным Полумесяцем.","criterion":"Точно назван символ.","alt":"Красный Кристалл.","img":"crystal"},{"id":"c7-400","cat":6,"value":400,"kind":"Источниковедение","section":"Тема 7","pages":"6","file":"Раздел 5. Тема 7-9(2).pdf","q":"Один документ регулирует средства и методы ведения боевых действий, другой защищает раненых, пленных и гражданское население. Укажите две группы конвенций и ключевые даты.","a":"Гаагские конвенции и декларации 1899 и 1907 гг. — методы войны; Женевские конвенции 1949 г. — защита жертв войны.","e":"Материал разграничивает предметы регулирования двух блоков международного гуманитарного права.","criterion":"Названы обе группы, указана их сфера и основные годы.","alt":"Гаага (1899/1907) — средства войны; Женева (1949) — жертвы войны.","img":null},{"id":"c7-500","cat":6,"value":500,"kind":"Применение Устава ООН","section":"Тема 7","pages":"6","file":"Раздел 5. Тема 7-9(2).pdf","q":"Совет Безопасности рассматривает угрозу миру и обсуждает прекращение торговли и транспортного сообщения; если этих мер окажется недостаточно, — применение вооружённых сил. Какие статьи Устава ООН регулируют два вида действий?","a":"Статья 41 — меры без использования вооружённых сил; статья 42 — действия с применением вооружённой силы.","e":"Различается характер мер, а не только интенсивность политического воздействия.","criterion":"Указаны обе статьи и принципиальное различие средств.","alt":"Ст. 41 — невоенные санкции; ст. 42 — вооружённые меры.","img":null},{"id":"c7-600","cat":6,"value":600,"kind":"Гуманитарный кейс","section":"Тема 7","pages":"4–5","file":"Раздел 5. Тема 7-9(2).pdf","q":"Во время вооружённого конфликта вооружённая группа заявляет: «Противник начал войну, поэтому нам разрешено атаковать мирных жителей и применять пытки». Опровергните тезис через два принципа международного гуманитарного права.","a":"МГП применяется независимо от того, кто начал конфликт; различение защищает гражданских лиц, а гуманное обращение запрещает пытки и издевательства.","e":"Правомерность начала войны не отменяет правил ведения вооружённого конфликта.","criterion":"Указана независимость применения МГП от оценки причин конфликта; названы два релевантных принципа.","alt":"Различение комбатантов и гражданских, запрет пыток; нормы МГП обязательны для всех сторон.","img":null},{"id":"c7-700","cat":6,"value":700,"kind":"Комплексный правовой анализ","section":"Тема 7","pages":"1–5","file":"Раздел 5. Тема 7-9(2).pdf","q":"Государства спорят о границе. Одна сторона требует немедленного силового изменения границы, другая ссылается на равенство и мирное урегулирование. Затем объявляют вооружённый конфликт и ставят под сомнение обязанность защищать пленных. Разделите две группы норм, которые должны применяться в этой ситуации.","a":"В межгосударственном споре действуют принципы территориальной целостности, суверенного равенства и мирного решения споров; в ходе вооружённого конфликта дополнительно обязательны нормы МГП о гуманном обращении и защите военнопленных.","e":"Международное право регулирует межгосударственные отношения; МГП устанавливает правила в вооружённом конфликте независимо от оценки сторон.","criterion":"Правильно разделены обе группы; названы минимум два общих принципа и один гуманитарный; отсутствие оправдания нарушения прав пленных.","alt":"Мирное урегулирование и неприкосновенность границ плюс международно-гуманитарная защита лиц.","img":null},{"id":"c8-100","cat":7,"value":100,"kind":"Термин","section":"Тема 8–9","pages":"7","file":"Раздел 5. Тема 7-9(2).pdf","q":"Какая теория связывает политику государств с географическими факторами: территорией, природными ресурсами, населением и климатом?","a":"Геополитика.","e":"В конспекте также отмечено, что современная геополитика учитывает и негeографические факторы.","criterion":"Назван термин.","alt":"Геополитический подход.","img":null},{"id":"c8-200","cat":7,"value":200,"kind":"Географический анализ","section":"Тема 8–9","pages":"8","file":"Раздел 5. Тема 7-9(2).pdf","q":"Объясните одну выгоду и одно ограничение географического положения Беларуси, связанного с отсутствием выхода к морю и ролью транзитных путей.","a":"Выгода — транзитное положение и транспортные коридоры; ограничение — зависимость доступа к морским перевозкам от портов соседних государств.","e":"Положение может быть ресурсом для международных связей и одновременно создавать уязвимости.","criterion":"Названы разные по знаку следствия и оба привязаны к географии.","alt":"Транзит — преимущество; отсутствие собственных морских портов — ограничение.","img":null},{"id":"c8-300","cat":7,"value":300,"kind":"Внешняя политика","section":"Тема 8–9","pages":"12","file":"Раздел 5. Тема 7-9(2).pdf","q":"Как называется заявленный в материалах принцип внешней политики Беларуси, предполагающий партнёрские связи по различным направлениям и в разных регионах мира?","a":"Многовекторность.","e":"В конспекте понятие связано с равноправным партнёрством и поиском различных направлений сотрудничества.","criterion":"Точно назван принцип и раскрыто многообразие направлений.","alt":"Многовекторная внешняя политика.","img":null},{"id":"c8-400","cat":7,"value":400,"kind":"Точность понятий","section":"Тема 8–9","pages":"10","file":"Раздел 5. Тема 7-9(2).pdf","q":"В чём различие информационного суверенитета и информационного нейтралитета Республики Беларусь?","a":"Суверенитет — право самостоятельно управлять национальными информационными ресурсами и информационной политикой; нейтралитет — невмешательство во внешнюю информационную сферу других государств и уважение их приоритетов.","e":"Это внутренняя самостоятельность и внешнеполитический принцип поведения, а не одно и то же.","criterion":"Оба понятия разграничены по объекту и направлению действия.","alt":"Самостоятельное управление своей информационной сферой vs уважение чужой без вмешательства.","img":null},{"id":"c8-500","cat":7,"value":500,"kind":"Институты международного сотрудничества","section":"Тема 8–9","pages":"14","file":"Раздел 5. Тема 7-9(2).pdf","q":"Укажите по одному специализированному международному учреждению для решения трёх задач: охрана здоровья; защита детства; образование, наука и культура.","a":"ВОЗ; ЮНИСЕФ; ЮНЕСКО соответственно.","e":"Материалы перечисляют профильные структуры, с которыми взаимодействует Беларусь.","criterion":"Все три организации и сферы их работы правильно соотнесены.","alt":"Всемирная организация здравоохранения; Детский фонд ООН; ЮНЕСКО.","img":null},{"id":"c8-600","cat":7,"value":600,"kind":"Анализ национальных интересов","section":"Тема 8–9","pages":"8–10","file":"Раздел 5. Тема 7-9(2).pdf","q":"Проект международного транспортного коридора обещает рабочие места и рост торговли, но требует дополнительных мер безопасности и расходов на инфраструктуру. Почему его нельзя оценивать только по экономической выгоде? Назовите минимум три различных измерения национальных интересов.","a":"Следует сопоставить экономическое развитие, суверенитет и безопасность, социальное благополучие граждан, устойчивость и защищённость коммуникаций.","e":"Конспекты рассматривают транспортное положение как ресурс и как источник рисков; национальные интересы многокомпонентны.","criterion":"Объяснён баланс выгод и рисков; названы не менее трёх различных измерений.","alt":"Экономическое, национально-безопасностное, социальное, инфраструктурное измерения.","img":null},{"id":"c8-700","cat":7,"value":700,"kind":"Международно-правовой кейс","section":"Тема 8–9","pages":"3, 12","file":"Раздел 5. Тема 7-9(2).pdf","q":"Предлагается межгосударственное соглашение, обеспечивающее выгодный транзит, однако его условия противоречат Конституции государства. Может ли одна экономическая выгода оправдать заключение такого договора согласно материалу? Предложите правовой и политический алгоритм действий.","a":"Нет: по ст. 8 Конституции Республики Беларусь нельзя заключать международные договоры, противоречащие Конституции. Следует согласовывать условия с конституционными нормами, вести переговоры, оценивать национальные интересы и только затем принимать обязательства.","e":"Внешняя политика сочетает экономические интересы с верховенством конституционных рамок и международно-правовыми обязательствами.","criterion":"Дан отрицательный ответ; названа конституционная преграда, переговорная корректировка и оценка интересов.","alt":"Отказ от противоречащих условий или их согласование с правом; переговоры и оценка выгод/рисков.","img":null}];
const FINAL={"id":"final","cat":-1,"value":0,"kind":"Финал · Чёрный ящик (3 подсказки)","section":"Тема 4","pages":"4 и 8","file":"Раздел 5. Тема 3-4(2).pdf","q":"В чёрном ящике скрыт политико-правовой механизм. Ведущий по очереди открывает три подсказки. Назовите точное понятие.","hints":["Это не самостоятельная ветвь власти и не отдельный орган, но без него принцип разделения властей может оказаться формальным.","Он позволяет ветвям государственной власти взаимно ограничивать полномочия друг друга и препятствовать злоупотреблениям.","Система взаимодействия законодательной, исполнительной и судебной властей, в названии которой используются слова об удерживании и балансировании."],"a":"Система сдержек и противовесов.","e":"В материалах механизм назван условием эффективного разделения власти на законодательную, исполнительную и судебную и предотвращения злоупотреблений.","alt":"Сдержки и противовесы; механизм взаимного контроля и уравновешивания трёх ветвей власти.","criterion":"Для полного зачёта названо понятие либо точно раскрыты взаимное ограничение полномочий и баланс ветвей власти.","img":null};

const src=q=>`${esc(q.file)} · ${esc(q.section)} · страница PDF ${esc(q.pages)}`;
const imageHTML=(name,alt='Иллюстрация из прикреплённых конспектов')=>name&&IMAGES[name]?`<img class="qpic" src="${IMAGES[name]}" alt="${esc(alt)}" loading="eager">`:'';
const snapshot=()=>{let o={...S};delete o.history;return JSON.parse(JSON.stringify(o));};
const commit=label=>{S.history.push({before:snapshot(),label});if(S.history.length>60)S.history.shift();};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageBroken=true;const el=$('#storagewarn');if(el)el.hidden=false;}}
function notify(msg){const x=$('#announce');if(!x)return;x.textContent=msg;x.style.display='block';setTimeout(()=>{if(x.textContent===msg)x.style.display='none'},3500);}
const btn=(action,label,cls='subtle',disabled=false,attrs='')=>`<button type="button" data-action="${action}" class="${cls}" ${disabled?'disabled':''} ${attrs}>${label}</button>`;
function scoreHeader(){const bar=$('#scorestrip');bar.style.display=S.stage==='setup'?'none':'block';if(S.stage==='setup')return;$('#scores').innerHTML=S.teams.map((t,i)=>`<div class="teamchip"><label class="sr-only" for="n${i}">Название команды ${i+1}</label><input id="n${i}" maxlength="32" data-rename="${i}" value="${esc(t.name)}" title="Нажмите, чтобы переименовать команду"><div class="teamscore">${t.score} <span class="small muted">баллов</span></div></div>`).join('');}
const saveRender=()=>{persist();render();};
function topbar(){return `<div class="toolbar">${btn('back','← Игровое поле','subtle',!['question','stake'].includes(S.stage))}${btn('undo','↶ Отменить последнее','subtle',!S.history.length||['finalQuestion','adjudicate'].includes(S.stage))}${btn('manual','± Изменить счёт','subtle',['finalQuestion','adjudicate'].includes(S.stage))}${btn('reset','Новая игра','danger')}</div>`;}
function infoBox(){return `<div class="notice" id="storagewarn" ${storageBroken?'':'hidden'}>Браузер не разрешил сохранить партию. Игра продолжает работать, но прогресс может исчезнуть после закрытия страницы.</div>`;}
function setup(){const names=S.teams.map((t,i)=>`<div><label class="label" for="setupname${i}">Команда ${i+1}</label><input class="field" id="setupname${i}" data-setupname="${i}" maxlength="32" value="${esc(t.name)}"></div>`).join('');return `${infoBox()}<section class="panel intro"><div class="sectiontag">Настройка игры</div><h2>Начните командный раунд</h2><p class="meta">56 олимпиадных заданий по политической сфере: 8 категорий × 7 уровней (100–700 баллов). Финальный «Чёрный ящик» с тремя подсказками.</p><div class="gridform"><div><label for="count" class="label">Число команд</label><select id="count" class="field" data-action="count">${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${S.teams.length===n?'selected':''}>${n}</option>`).join('')}</select></div><div><label class="label" for="penalty">Штраф за неверный ответ</label><select class="field" id="penalty" data-setting="penalty"><option value="false" ${!S.penalty?'selected':''}>Без списания (по умолчанию)</option><option value="true" ${S.penalty?'selected':''}>Минус стоимость вопроса</option></select></div><div><label class="label" for="duration">Время на вопрос</label><select class="field" id="duration" data-setting="duration">${[30,60,90].map(x=>`<option value="${x}" ${S.duration===x?'selected':''}>${x} секунд</option>`).join('')}</select></div><div><label class="timercheckbox" for="timerOn"><input type="checkbox" id="timerOn" data-setting="timerOn" ${S.timerOn?'checked':''}>Включить таймер</label></div></div><h3>Названия команд</h3><div class="starter">${names}</div><div class="actions">${btn('start','Начать игру →','primary')}</div><div class="rule"><strong>Для ведущего.</strong> Команды отвечают устно. При неверном ответе можно передать ход, не раскрывая решения. Ставки финала станут известны только после проверки ответов.</div><p class="small muted">Источники: §§ 1–5, пять приложенных PDF (ОБР11_0101, 0102, 0103, 0104, 0105). Задания повышенной сложности требуют аргументации и анализа ситуаций. Ситуации учебных кейсов условные, теоретические выводы основаны на пособии.</p></section>`;}
function board(){const count=Object.keys(S.used).filter(k=>S.used[k]).length;let cells=CATEGORIES.map(c=>`<div class="category" role="columnheader">${esc(c)}</div>`).join('');for(const val of [100,200,300,400,500,600,700]){for(let cat=0;cat<8;cat++){const q=QUESTIONS.find(q=>q.cat===cat&&q.value===val);const done=!!S.used[q.id],started=(S.attempts[q.id]||[]).length>0&&!done;const label=done?'✓ Использован':started?'↪ В работе':val;cells+=`<button class="tile ${done?'done':started?'live':''}" data-action="open" data-id="${q.id}" ${done?'disabled':''} aria-label="${esc(CATEGORIES[cat])}, ${val} баллов, ${done?'вопрос использован':started?'вопрос в работе':'открыть вопрос'}">${label}</button>`;}}return `${infoBox()}${topbar()}<section class="panel"><div class="sectiontag">Основной раунд</div><div class="toprow"><div><h2>Игровое поле</h2><p class="meta">Выберите тему и стоимость. По окончании раунда перейдите к финалу.</p></div><span class="tag">${count} / 56 закрыто</span></div><div class="statsline"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="56" aria-valuenow="${count}" aria-label="Пройденные вопросы"><span style="width:${count/56*100}%"></span></div>${btn('finalGo','Перейти к финалу','blue')}${btn('skipFinal','Завершить без финала','outline')}</div><div class="boardwrap" role="region" aria-label="Игровое поле: прокрутите по горизонтали, чтобы увидеть все категории" tabindex="0"><div class="board" role="group">${cells}</div></div><p class="small muted">На телефоне поле прокручивается горизонтально. ✓ — использован, ↪ — вопрос в работе.</p></section>`;}
function answerMarkup(q){return `<section class="answer"><h3>Правильный ответ</h3><p class="truth">${esc(q.a)}</p><h3>Пояснение</h3><p>${esc(q.e)}</p><h3>Допустимые варианты ответа</h3><p>${esc(q.alt)}</p><h3>Критерии зачёта</h3><p>${esc(q.criterion)}</p><h3>Источник</h3><p class="small">${src(q)}</p></section>`;}
function timerHTML(){if(!S.timerOn)return `<p class="small muted">Таймер отключён в настройках партии.</p>`;return `<div class="timerbox" aria-label="Таймер"><strong>Таймер</strong><span class="timevalue ${S.seconds===0?'expired':''}" id="timevalue">${fmt(S.seconds)}</span>${btn('timerStart','▶ Старт','outline',clockRunning||S.seconds===0)}${btn('timerPause','Ⅱ Пауза','subtle',!clockRunning)}${btn('timerReset','↻ Сброс','subtle')}<span class="small" id="timerMessage">${S.seconds===0?'Время вышло — ответ не раскрыт.':clockRunning?'Время идёт':'Таймер на паузе'}</span></div>`;}
function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function card(){const q=item(S.current);if(!q){S.stage='board';return board();}const closed=!!S.used[q.id],reveal=!!S.revealed[q.id],attempted=S.attempts[q.id]||[];const avail=S.teams.map((t,i)=>i).filter(i=>!attempted.includes(i));const teamOpts=S.teams.map((t,i)=>`<option value="${i}" ${i===S.answerTeam?'selected':''} ${attempted.includes(i)?'disabled':''}>${esc(t.name)}${attempted.includes(i)?' — уже отвечала':''}</option>`).join('');const eligible=!closed&&!attempted.includes(S.answerTeam);const back=closed?'Вопрос закрыт и не принесёт новых баллов.':attempted.length?'Некоторые команды уже отвечали. Их повторная попытка не засчитывается.':'Ответ скрыт до решения ведущего.';return `${infoBox()}${topbar()}<section class="panel"><div class="questionhead"><span class="tag">${esc(CATEGORIES[q.cat])}</span><span class="tag points">${q.value} баллов</span><span class="tag">${esc(q.kind)}</span>${closed?'<span class="tag">✓ Вопрос закрыт</span>':''}</div><h2 class="sr-only">Вопрос</h2><div class="prompt">${esc(q.q)}</div>${imageHTML(q.img,'Иллюстрация к заданию, без подписи и ответа')}${timerHTML()}<div class="session"><div class="columns"><label class="label" for="teamChoice">Отвечает команда</label><select id="teamChoice" class="field" style="width:auto" data-action="teamChoice" ${closed||avail.length===0?'disabled':''}>${teamOpts}</select></div><p class="small muted">${esc(back)}</p><div class="actions">${btn('correct','✓ Верно (+ баллы)','primary',!eligible)}${btn('wrong',S.penalty?'✕ Неверно (− баллы)':'✕ Неверно','danger',!eligible)}${btn('nextTeam','Передать ответ →','subtle',closed||!attempted.length||avail.length===0)}${btn('noAnswer','Без ответа','subtle',closed)}</div>${attempted.length?`<p class="small muted">Уже отвечали: ${attempted.map(i=>esc(S.teams[i]?.name)).join(', ')}.</p>`:''}${S.closed[q.id]?`<p class="feedback"><strong>Результат:</strong> ${esc(S.closed[q.id])}. Начисление по этой карточке заблокировано.</p>`:''}</div><div class="actions">${btn('reveal',reveal?'Ответ уже показан':'Показать ответ','blue',reveal)}${btn('back','← Вернуться к полю','subtle')}</div>${reveal?answerMarkup(q):''}</section>`;}
function stake(){return `${infoBox()}${topbar()}<section class="panel intro"><div class="sectiontag">Финальный раунд • шаг 1</div><h2>Тайные ставки</h2><p>Каждая команда указывает ставку от 0 до своего положительного счёта. Если счёт нулевой или отрицательный, ставка может быть только нулевой.</p><p class="meta">После подтверждения ставки будут зафиксированы и скрыты до объявления итогов. Изменить их затем нельзя.</p><div class="betrows">${S.teams.map((t,i)=>`<div class="betrow"><strong>${esc(t.name)}</strong><label class="sr-only" for="w${i}">Ставка команды ${esc(t.name)}</label><input class="field" type="number" inputmode="numeric" min="0" max="${Math.max(0,t.score)}" step="1" value="0" id="w${i}" data-wager="${i}" ${t.score<=0?'disabled':''}><span class="small muted">Максимум: ${Math.max(0,t.score)}</span></div>`).join('')}</div><div class="actions">${btn('lockWagers','Зафиксировать ставки и открыть финал','primary')}${btn('skipFinal','Пропустить финал','outline')}</div></section>`;}
function finalQuestion(){return `${infoBox()}${topbar()}<section class="panel intro"><div class="sectiontag">Финал • «Чёрный ящик»</div><h2>Что находится в чёрном ящике?</h2><p class="meta">Ставки зафиксированы и скрыты. Команды записывают ответы на бумаге. Решение о правильности принимает ведущий.</p><div class="prompt">${esc(FINAL.q)}</div><div class="hints">${FINAL.hints.slice(0,S.hintsSeen||0).map((h,i)=>`<div class="hint"><strong>Подсказка ${i+1}</strong><p>${esc(h)}</p></div>`).join('')}</div>${(S.hintsSeen||0)<3?btn('nextHint','Открыть подсказку '+((S.hintsSeen||0)+1),'blue'):''}${timerHTML()}<div class="actions">${btn('finalReveal',S.finalRevealed?'Ответ показан':'Показать ответ','blue',S.finalRevealed)}${btn('finalAdjudicate','Оценить ответы команд →','primary')}${btn('skipFinal','Пропустить финал','outline')}</div>${S.finalRevealed?answerMarkup(FINAL):''}</section>`;}
function adjudicate(){return `${infoBox()}${topbar()}<section class="panel intro"><div class="sectiontag">Финал • проверка</div><h2>Результаты ответов</h2><p>Отметьте верный или неверный ответ каждой команды. Ставки остаются скрытыми до подведения итогов.</p><div class="betrows">${S.teams.map((t,i)=>`<div class="betrow"><strong>${esc(t.name)}</strong><span class="small muted">Ставка скрыта</span><div class="radiochoices" role="group" aria-label="Ответ команды ${esc(t.name)}"><label><input type="radio" name="v${i}" value="yes" data-verdict="${i}" ${S.verdicts[i]==='yes'?'checked':''}> Верно</label><label><input type="radio" name="v${i}" value="no" data-verdict="${i}" ${S.verdicts[i]==='no'?'checked':''}> Неверно</label></div></div>`).join('')}</div><div class="actions">${btn('finish','Завершить и открыть итоги','primary')}${btn('finalReturn','← Вернуться к финальному вопросу','subtle')}</div></section>`;}
function results(){const mx=Math.max(...S.teams.map(t=>t.score));const winners=S.teams.filter(t=>t.score===mx);const count=Object.keys(S.used).filter(k=>S.used[k]).length;return `${infoBox()}<div class="toolbar">${btn('undo','↶ Отменить последнее','subtle',!S.history.length)}${btn('manual','± Изменить счёт','subtle')}${btn('reset','Новая игра','primary')}</div><section class="panel"><div class="sectiontag">Итоги игры</div><h2>Финиш!</h2><div class="winner">${winners.length===1?'Победитель: '+esc(winners[0].name):'Победители: '+winners.map(t=>esc(t.name)).join(', ')}</div><p class="meta">Пройдено карточек: ${count} из 56. Финал ${S.finalPlayed?'проведён':'пропущен'}.</p><div class="tablewrap"><table><thead><tr><th>Место</th><th>Команда</th><th style="text-align:right">Баллы</th>${S.finalPlayed?'<th style="text-align:right">Ставка финала</th><th>Ответ</th>':''}</tr></thead><tbody>${S.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score).map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.name)}</td><td class="num">${t.score}</td>${S.finalPlayed?`<td class="num">${S.wagers[t.i]}</td><td>${S.verdicts[t.i]==='yes'?'Верно':'Неверно'}</td>`:''}</tr>`).join('')}</tbody></table></div></section><section class="panel review" style="margin-top:18px"><h2>Повторить материал</h2><p class="muted">Открывайте задания, чтобы увидеть верные ответы, пояснения, критерии и страницы PDF. Этот раздел недоступен во время игры.</p>${CATEGORIES.map((cat,ci)=>`<h3>${esc(cat)}</h3>${QUESTIONS.filter(q=>q.cat===ci).map(q=>`<details><summary>${q.value} баллов. ${esc(q.q)}</summary>${imageHTML(q.img,'Иллюстрация из учебника')}${answerMarkup(q)}</details>`).join('')}`).join('')}<h3>Финальный «Чёрный ящик»</h3><details><summary>${esc(FINAL.q)}</summary>${imageHTML(FINAL.img)}${answerMarkup(FINAL)}</details></section><p class="foot">Материал: «Обществоведение», 11 класс, раздел I «Становление информационной цивилизации», §§ 1–5; прикреплённые файлы ОБР11_0101–0105. Тексты и фрагменты иллюстраций находятся внутри HTML. Интернет не нужен.</p>`;}
function render(){scoreHeader();const root=$('#root');const view={setup,board,question:card,stake,finalQuestion,adjudicate,results}[S.stage]||setup;root.innerHTML=view();}
function closeTimer(){if(clockRunning){S.seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));clockRunning=false;}}
function timerReset(){closeTimer();S.seconds=S.duration;persist();render();}
function startTimer(){if(!S.timerOn||clockRunning||S.seconds<=0)return;deadline=Date.now()+S.seconds*1000;clockRunning=true;render();}
function pauseTimer(){closeTimer();saveRender();}
setInterval(()=>{if(!clockRunning)return;const remain=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(remain===S.seconds)return;S.seconds=remain;const el=$('#timevalue'),msg=$('#timerMessage');if(el){el.textContent=fmt(remain);el.classList.toggle('expired',remain===0);}if(remain===0){clockRunning=false;if(msg)msg.textContent='Время вышло! Ответ остаётся скрытым.';notify('Время вышло. Ведущий принимает решение самостоятельно.');render();}else if(msg)msg.textContent='Время идёт';persist();},300);
function go(stage){closeTimer();S.stage=stage;saveRender();window.scrollTo({top:0,behavior:'auto'});}
function newQuestion(id){if(S.used[id])return;closeTimer();S.current=id;S.stage='question';S.seconds=S.duration;let att=S.attempts[id]||[];S.answerTeam=S.teams.findIndex((_,i)=>!att.includes(i));if(S.answerTeam<0)S.answerTeam=0;saveRender();window.scrollTo(0,0);}
function setScore(t,delta){S.teams[t].score+=delta;}
function attempt(type){const id=S.current,q=item(id),i=S.answerTeam;if(!q||S.used[id]||S.revealed[id]||(S.attempts[id]||[]).includes(i))return;if(type==='correct'){commit('Верный ответ');setScore(i,q.value);S.used[id]=true;S.closed[id]=`${S.teams[i].name}: верно (+${q.value})`;closeTimer();}else{commit('Неверный ответ');S.attempts[id]=[...(S.attempts[id]||[]),i];if(S.penalty)setScore(i,-q.value);const remaining=S.teams.some((t,k)=>!S.attempts[id].includes(k));if(!remaining){S.used[id]=true;closeTimer();S.closed[id]='Все команды ответили неверно';}else{S.closed[id]='';}}saveRender();}
function undo(){const last=S.history.pop();if(!last)return;closeTimer();const history=S.history;S={...empty(),...last.before,history};if(S.stage==='question'&&!item(S.current))S.stage='board';saveRender();notify('Отменено: '+last.label);}
function resetGame(){if(!confirm('Начать новую игру? Все баллы, ответы и ставки текущей партии будут сброшены.'))return;closeTimer();S=empty();try{localStorage.removeItem(KEY)}catch(e){}saveRender();}
function finalGo(){if(Object.keys(S.used).filter(x=>S.used[x]).length<56&&!confirm('Не все карточки сыграны. Всё равно перейти к финалу?'))return;go('stake');}
function skipFinal(){if(!confirm('Пропустить финальный вопрос и подвести итоги без изменения баллов?'))return;commit('Финал пропущен');S.wagers=null;S.finalPlayed=false;go('results');}
function lockWagers(){const wagers=[];for(let i=0;i<S.teams.length;i++){const input=$(`[data-wager="${i}"]`);const value=S.teams[i].score>0?Number(input.value):0;const max=Math.max(0,S.teams[i].score);if(!Number.isInteger(value)||value<0||value>max){alert(`Проверьте ставку команды «${S.teams[i].name}»: допустимо от 0 до ${max}.`);input?.focus();return;}wagers.push(value);}if(!confirm('Зафиксировать все ставки? После подтверждения изменить их нельзя.'))return;commit('Фиксация ставок');S.wagers=wagers;S.verdicts={};S.finalRevealed=false;S.hintsSeen=0;S.seconds=S.duration;go('finalQuestion');}
function finishFinal(){if(S.stage!=='adjudicate'||!S.wagers)return;if(S.teams.some((t,i)=>!['yes','no'].includes(S.verdicts[i]))){notify('Нужно оценить ответы всех команд.');return;}if(!confirm('Завершить финал и применить все ставки?'))return;commit('Итог финала');S.teams.forEach((t,i)=>t.score+=S.verdicts[i]==='yes'?S.wagers[i]:-S.wagers[i]);S.finalPlayed=true;go('results');}
function manual(){const opts=S.teams.map((t,i)=>`${i+1}. ${t.name}: ${t.score}`).join('\n');const team=prompt('Номер команды для корректировки:\n'+opts,'1');if(team===null)return;const idx=Number(team)-1;if(!Number.isInteger(idx)||idx<0||idx>=S.teams.length){notify('Неверный номер команды.');return;}const val=prompt('Сколько баллов добавить или снять? Введите целое число, например 200 или -100.','100');if(val===null)return;if(!/^[+-]?\d+$/.test(val.trim())){notify('Введите целое число.');return;}const delta=Number(val);if(!Number.isSafeInteger(delta)){notify('Слишком большое значение.');return;}commit('Ручная корректировка');setScore(idx,delta);saveRender();}
document.addEventListener('click',ev=>{const b=ev.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;switch(a){case'start':S.stage='board';saveRender();break;case'open':newQuestion(b.dataset.id);break;case'back':if(['question','stake'].includes(S.stage))go('board');break;case'correct':case'wrong':attempt(a);break;case'noAnswer':{if(!S.current||S.used[S.current])break;commit('Без ответа');S.used[S.current]=true;S.closed[S.current]='Без ответа (0 баллов)';closeTimer();saveRender();break;}case'nextTeam':{const att=S.attempts[S.current]||[];const next=S.teams.findIndex((_,i)=>!att.includes(i));if(next>=0){S.answerTeam=next;saveRender();notify(`Ход передан команде «${S.teams[next].name}».`);}break;}case'reveal':{if(S.revealed[S.current])break;commit('Показ ответа');S.revealed[S.current]=true;S.used[S.current]=true;if(!S.closed[S.current])S.closed[S.current]='Ответ раскрыт';closeTimer();saveRender();break;}case'undo':if(!['finalQuestion','adjudicate'].includes(S.stage))undo();break;case'reset':resetGame();break;case'manual':if(!['finalQuestion','adjudicate'].includes(S.stage))manual();break;case'timerStart':startTimer();break;case'timerPause':pauseTimer();break;case'timerReset':timerReset();break;case'finalGo':finalGo();break;case'skipFinal':skipFinal();break;case'lockWagers':lockWagers();break;case'nextHint':S.hintsSeen=Math.min(3,(S.hintsSeen||0)+1);saveRender();break;case'finalReveal':if(!S.finalRevealed){S.finalRevealed=true;closeTimer();saveRender();}break;case'finalAdjudicate':go('adjudicate');break;case'finalReturn':go('finalQuestion');break;case'finish':finishFinal();break;}});
document.addEventListener('change',ev=>{let t=ev.target;const act=t.dataset.action;if(act==='count'){let count=Number(t.value);S.teams=Array.from({length:count},(_,i)=>S.teams[i]||{name:`Команда ${i+1}`,score:0});saveRender();}else if(act==='teamChoice'){let idx=Number(t.value);if(!S.used[S.current] && !(S.attempts[S.current]||[]).includes(idx)){S.answerTeam=idx;persist();}}else if(t.dataset.setting){if(t.dataset.setting==='duration')S.duration=Number(t.value);else if(t.dataset.setting==='timerOn')S.timerOn=t.checked;else if(t.dataset.setting==='penalty')S.penalty=t.value==='true';S.seconds=S.duration;persist();}else if(t.dataset.rename!==undefined){const i=Number(t.dataset.rename),v=t.value.trim().slice(0,32);S.teams[i].name=v||`Команда ${i+1}`;saveRender();}else if(t.dataset.setupname!==undefined){const i=Number(t.dataset.setupname),v=t.value.trim().slice(0,32);S.teams[i].name=v||`Команда ${i+1}`;persist();}else if(t.dataset.verdict!==undefined){S.verdicts[Number(t.dataset.verdict)]=t.value;persist();}});
window.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.stage==='question'&&document.activeElement?.tagName!=='INPUT'){go('board');}});
render();if(storageBroken)notify('Автосохранение заблокировано — партия работает без него.');
</script></body></html>
